name: Propose Orinoco update

on:
  workflow_dispatch:
    inputs:
      template_version:
        description: Exact immutable template tag
        required: false
        type: string
      engine_version:
        description: Exact orinoco-lite package version
        required: false
        type: string
      engine_url:
        description: Immutable orinoco-lite wheel URL
        required: false
        type: string
      engine_sha256:
        description: Orinoco engine wheel SHA-256
        required: false
        type: string
      runtime_version:
        description: Exact runtime version (requires all runtime integrity inputs)
        required: false
        type: string
      runtime_url:
        description: Immutable runtime archive URL
        required: false
        type: string
      runtime_sha256:
        description: Runtime archive SHA-256
        required: false
        type: string
      runtime_manifest_sha256:
        description: Runtime manifest SHA-256
        required: false
        type: string
      workflow_sha:
        description: Full reviewed Orinoco release commit SHA
        required: false
        type: string
      workflow_ref:
        description: Full reusable-workflow path and reviewed commit SHA
        required: false
        type: string
      classification:
        description: Review classification
        required: true
        default: compatibility
        type: choice
        options: [compatibility, security, presentation]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orinoco-framework-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository != 'ORINOCO-Lite/orinoco-lite-template'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete update history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the current locked Pixi environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.73.0
      - name: Apply the content-preserving framework update
        env:
          ORINOCO_UPDATE_TEMPLATE: ${{ inputs.template_version }}
          ORINOCO_UPDATE_ENGINE: ${{ inputs.engine_version }}
          ORINOCO_ENGINE_URL: ${{ inputs.engine_url }}
          ORINOCO_ENGINE_SHA256: ${{ inputs.engine_sha256 }}
          ORINOCO_UPDATE_RUNTIME: ${{ inputs.runtime_version }}
          ORINOCO_RUNTIME_URL: ${{ inputs.runtime_url }}
          ORINOCO_RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          ORINOCO_RUNTIME_MANIFEST_SHA256: ${{ inputs.runtime_manifest_sha256 }}
          ORINOCO_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          ORINOCO_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          ORINOCO_UPDATE_CLASSIFICATION: ${{ inputs.classification || 'compatibility' }}
        run: pixi run update-orinoco
      - name: Validate the complete updated site
        run: pixi run test-all
      - name: Record passing validation
        run: >-
          python .orinoco-lite/tools/finalize_update_ledger.py --status passed
          --command "pixi run test-all"
      - name: Open an ordinary review pull request
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          branch: automation/orinoco-framework-update
          delete-branch: true
          commit-message: |
            chore(deps): update Orinoco framework

            Co-Authored-By: Codex CLI 0.143.0 / GPT 5.6-sol <codex@openai.com>
          title: "chore(deps): update Orinoco framework"
          body: |
            **AI-generated draft — not reviewed by John**

            This pull request was generated by the pinned Orinoco updater.

            Review the focused lock, answer, and template-owned file changes.
            The workflow validated the complete updated site before opening this
            pull request; its detailed update state remains an ignored CI artifact.

            The updater does not merge this pull request automatically.
          labels: dependencies,orinoco-update
