name: Curate source metadata

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Source adapter to review
        required: true
        type: choice
        options: [dump-research-info, zotero]
      source_refspec:
        description: Dump source refspec (resolved to an exact commit)
        required: false
        default: main
        type: string
      expected_library_version:
        description: Exact committed Zotero library version (Zotero only)
        required: false
        type: string
      acknowledge_public_review_data:
        description: Proposal data, reviewer identity, and decisions remain public
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions: {}

jobs:
  propose:
    name: Open one metadata curation pull request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      github.run_attempt == 1 &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: curation-proposal-${{ inputs.adapter }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate public proposal inputs
        env:
          ACKNOWLEDGED: ${{ inputs.acknowledge_public_review_data }}
          ADAPTER: ${{ inputs.adapter }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          SOURCE_REFSPEC: ${{ inputs.source_refspec }}
        run: |
          python - <<'PY'
          import os
          import re

          if os.environ["ACKNOWLEDGED"] != "true":
              raise SystemExit("public review-data acknowledgment is required")
          if os.environ["ADAPTER"] == "dump-research-info":
              ref = os.environ["SOURCE_REFSPEC"]
              if (
                  re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", ref) is None
                  or ".." in ref
                  or ref.endswith("/")
              ):
                  raise SystemExit("dump source_refspec is invalid")
              if os.environ["EXPECTED_LIBRARY_VERSION"]:
                  raise SystemExit("dump proposals do not use a Zotero version")
          elif re.fullmatch(
              r"[1-9][0-9]*", os.environ["EXPECTED_LIBRARY_VERSION"]
          ) is None:
              raise SystemExit("Zotero proposals require an exact library version")
          PY

      - name: Install the trusted locked Pixi environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.73.0

      - name: Resolve the reviewed adapter provenance identity
        id: source_policy
        env:
          ADAPTER: ${{ inputs.adapter }}
        run: |
          set -euo pipefail
          identity="$(
            pixi run python .orinoco-lite/source-adapters/metadata/tools/review.py \
              resolve-provenance-identity \
              --adapter "$ADAPTER" \
              --config site-specific/sources
          )"
          [[ -n "$identity" && "$identity" != *$'\n'* && "$identity" != *$'\r'* ]]
          printf 'provenance_identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify the released runtime
        id: runtime
        run: |
          pixi run orinoco --root . runtime verify --json \
            > "$RUNNER_TEMP/runtime.json"
          python - "$RUNNER_TEMP/runtime.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = value.get("root")
          if not isinstance(root, str) or not Path(root).is_dir():
              raise SystemExit("locked runtime did not resolve to a directory")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"root={root}\n")
          PY

      - name: Check out the selected dump source as data
        if: inputs.adapter == 'dump-research-info'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: build/curation/sources/dump-research-info
          persist-credentials: false
          ref: ${{ inputs.source_refspec }}
          repository: con/dump-research-info

      - name: Resolve the dump source to an exact commit
        if: inputs.adapter == 'dump-research-info'
        id: source
        run: |
          revision="$(
            git -C build/curation/sources/dump-research-info rev-parse HEAD
          )"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Build the ephemeral candidate plan
        id: plan
        env:
          ADAPTER: ${{ inputs.adapter }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          PROVENANCE_IDENTITY: ${{ steps.source_policy.outputs.provenance_identity }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          command=(
            pixi run python .orinoco-lite/source-adapters/metadata/tools/curation.py
            inspect-plan
            --root "$GITHUB_WORKSPACE"
            --trusted-root "$GITHUB_WORKSPACE"
            --runtime-root "$RUNTIME_ROOT"
            --adapter "$ADAPTER"
            --adapter-agent-pid "$PROVENANCE_IDENTITY"
            --metadata-base "$base_sha"
            --scratch "$GITHUB_WORKSPACE/build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-checkout \
              "$GITHUB_WORKSPACE/build/curation/sources/dump-research-info"
              --source-revision "$SOURCE_REVISION"
            )
          else
            command+=(--expected-library-version "$EXPECTED_LIBRARY_VERSION")
          fi
          "${command[@]}" > "$RUNNER_TEMP/plan.json"
          python - "$RUNNER_TEMP/plan.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          count = plan.get("candidate_count")
          if isinstance(count, bool) or not isinstance(count, int) or count < 0:
              raise SystemExit("host returned an invalid candidate count")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"candidate_count={count}\n")
              stream.write(f"has_candidates={str(count > 0).lower()}\n")
          PY
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Report an idempotent empty proposal
        if: steps.plan.outputs.has_candidates == 'false'
        run: |
          {
            echo "## No curation pull request opened"
            echo
            echo "The exact active candidate plan is empty."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the proposal branch
        if: steps.plan.outputs.has_candidates == 'true'
        id: branch
        env:
          ADAPTER: ${{ inputs.adapter }}
        run: |
          branch="automation/curation/${ADAPTER}-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          printf 'name=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Create one explicit DataLad proposal commit
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          ADAPTER: ${{ inputs.adapter }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          PROVENANCE_IDENTITY: ${{ steps.source_policy.outputs.provenance_identity }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          python - "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/proposal-message.txt" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          coordinate = json.dumps(
              plan["source_coordinate"],
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          )
          message = (
              f"chore(curation): propose {os.environ['ADAPTER']} metadata\n\n"
              f"Curation-Adapter: {os.environ['ADAPTER']}\n"
              "Curation-Adapter-Agent: "
              f"{os.environ['PROVENANCE_IDENTITY']}\n"
              f"Curation-Metadata-Base: {os.environ['BASE_SHA']}\n"
              f"Curation-Source: {coordinate}\n"
          )
          Path(sys.argv[2]).write_text(message, encoding="utf-8")
          PY
          command=(
            python .orinoco-lite/source-adapters/metadata/tools/curation.py
            stage-proposal
            --root "$GITHUB_WORKSPACE"
            --trusted-root "$GITHUB_WORKSPACE"
            --runtime-root "$RUNTIME_ROOT"
            --adapter "$ADAPTER"
            --adapter-agent-pid "$PROVENANCE_IDENTITY"
            --metadata-base "$BASE_SHA"
            --scratch "$GITHUB_WORKSPACE/build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-checkout \
              "$GITHUB_WORKSPACE/build/curation/sources/dump-research-info"
              --source-revision "$SOURCE_REVISION"
            )
          else
            command+=(--expected-library-version "$EXPECTED_LIBRARY_VERSION")
          fi
          unset GH_TOKEN GITHUB_TOKEN
          pixi run datalad run --explicit \
            -m "$(<"$RUNNER_TEMP/proposal-message.txt")" \
            -o site-specific/metadata/records \
            -o site-specific/metadata/overlays/annotations \
            -- "${command[@]}"
          test "$(git rev-list --count "${BASE_SHA}..HEAD")" = 1
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git config --local --get-regexp 'http\..*\.extraheader' || true)"
          python - "$BASE_SHA" <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          import sys

          raw = subprocess.check_output(
              [
                  "git", "diff", "--name-status", "-z", "--no-renames",
                  sys.argv[1], "HEAD",
              ]
          ).split(b"\0")
          entries = [item.decode("utf-8") for item in raw if item]
          if not entries or len(entries) % 2:
              raise SystemExit("proposal commit has no ordinary metadata changes")
          records = 0
          for status, rendered in zip(entries[::2], entries[1::2], strict=True):
              path = PurePosixPath(rendered)
              if status not in {"A", "M", "D"}:
                  raise SystemExit(f"proposal uses unsupported {status} change: {path}")
              if path.parts[:3] == ("site-specific", "metadata", "records"):
                  records += 1
              elif path.parts[:4] != (
                  "site-specific", "metadata", "overlays", "annotations"
              ):
                  raise SystemExit(f"proposal changed a non-metadata path: {path}")
          if records == 0:
              raise SystemExit("proposal commit changes no canonical record")
          PY

      - name: Record the exact proposal commit
        if: steps.plan.outputs.has_candidates == 'true'
        id: proposal
        run: |
          proposal_sha="$(git rev-parse HEAD)"
          [[ "$proposal_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$proposal_sha" >> "$GITHUB_OUTPUT"

      - name: Push the exact proposal branch
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Open one draft pull request
        if: steps.plan.outputs.has_candidates == 'true'
        id: pull
        env:
          ADAPTER: ${{ inputs.adapter }}
          BRANCH: ${{ steps.branch.outputs.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Keep the job token for this bot-created pull request. GitHub does
          # not recursively start pull_request workflows for its writes; the
          # exact proposal receives one explicit full dispatch below.
          if ! gh api "repos/${REPOSITORY}/labels/curation-review" \
            > /dev/null 2>&1; then
            gh label create curation-review \
              --repo "$REPOSITORY" \
              --color 5319E7 \
              --description "Human source-metadata curation" || \
              gh api "repos/${REPOSITORY}/labels/curation-review" > /dev/null
          fi
          initial_body='The trusted workflow is preparing the curation review link.'
          url="$(gh pr create \
            --repo "$REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "chore(curation): review ${ADAPTER} metadata" \
            --body "$initial_body" \
            --label curation-review \
            --draft)"
          number="${url##*/}"
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Render one untracked review bundle from the proposal
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          ADAPTER: ${{ inputs.adapter }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          NUMBER: ${{ steps.pull.outputs.number }}
          PROVENANCE_IDENTITY: ${{ steps.source_policy.outputs.provenance_identity }}
          PROPOSAL_SHA: ${{ steps.proposal.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/proposal-base"
          git worktree add --detach "$base_root" "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/review-artifact"
          command=(
            pixi run python .orinoco-lite/source-adapters/metadata/tools/curation.py
            render-review-bundle
            --root "$base_root"
            --trusted-root "$GITHUB_WORKSPACE"
            --runtime-root "$RUNTIME_ROOT"
            --adapter "$ADAPTER"
            --adapter-agent-pid "$PROVENANCE_IDENTITY"
            --metadata-base "$BASE_SHA"
            --proposal-sha "$PROPOSAL_SHA"
            --repository "$REPOSITORY"
            --pull-request "$NUMBER"
            --workflow-run-id "$GITHUB_RUN_ID"
            --scratch "$base_root/build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
            --output "$RUNNER_TEMP/review-artifact/review-bundle.json"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-checkout \
              "$GITHUB_WORKSPACE/build/curation/sources/dump-research-info"
              --source-revision "$SOURCE_REVISION"
            )
          else
            command+=(--expected-library-version "$EXPECTED_LIBRARY_VERSION")
          fi
          unset GH_TOKEN GITHUB_TOKEN
          "${command[@]}" > "$RUNNER_TEMP/review-bundle-report.json"
          mapfile -t artifact_files < <(
            find "$RUNNER_TEMP/review-artifact" -type f -print
          )
          test "${#artifact_files[@]}" = 1
          test "${artifact_files[0]}" = \
            "$RUNNER_TEMP/review-artifact/review-bundle.json"

      - name: Upload the single review-bundle artifact
        if: steps.plan.outputs.has_candidates == 'true'
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orinoco-curation-review-${{ steps.proposal.outputs.sha }}
          path: ${{ runner.temp }}/review-artifact/review-bundle.json
          if-no-files-found: error

      - name: Render the concise editable pull-request body
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          pixi run python .orinoco-lite/source-adapters/metadata/tools/curation.py \
            render-pr-body \
            --root "$GITHUB_WORKSPACE" \
            --bundle "$RUNNER_TEMP/review-artifact/review-bundle.json" \
            --artifact-id "$ARTIFACT_ID" \
            --output "$RUNNER_TEMP/pr-body.md" \
            > "$RUNNER_TEMP/pr-body-report.json"

      - name: Publish the review link on the draft pull request
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pull.outputs.number }}
          PULL_URL: ${{ steps.pull.outputs.url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr edit "$NUMBER" --repo "$REPOSITORY" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          {
            echo "## Curation pull request opened"
            echo
            echo "$PULL_URL"
            echo
            echo "Review artifact: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch full validation for the exact proposal ref
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run validate.yml \
            --repo "$REPOSITORY" \
            --ref "$BRANCH" \
            -f "validation=full"

      - name: Dispatch exact-head SHACL Vue validation for the proposal
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.proposal.outputs.sha }}
          NUMBER: ${{ steps.pull.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run shacl-vue-proposal.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "pull_request=${NUMBER}" \
            -f "expected_head=${HEAD_SHA}"

  submit:
    name: Verify and apply one complete review
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/curation submit') &&
      github.repository != 'ORINOCO-Lite/orinoco-lite-template'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: curation-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted current default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install the trusted locked Pixi environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          manifest-path: trusted/pixi.toml
          pixi-version: v0.73.0

      - name: Parse only the exact complete JSON submission
        run: |
          python - "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/submission-comment.md" <<'PY'
          import json
          from pathlib import Path
          import sys

          event = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(event["comment"]["body"], encoding="utf-8")
          PY
          pixi run --manifest-path trusted/pixi.toml python \
            trusted/.orinoco-lite/source-adapters/metadata/tools/curation.py \
            inspect-submission \
            --comment "$RUNNER_TEMP/submission-comment.md" \
            > "$RUNNER_TEMP/submission.json"

      - name: Verify the pull request and authenticated curator
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" > "$RUNNER_TEMP/pr.json"
          actor="$(python -c \
            'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["comment"]["user"]["login"])')"
          gh api "repos/${REPOSITORY}/collaborators/${actor}/permission" \
            > "$RUNNER_TEMP/permission.json"
          python - "$RUNNER_TEMP/submission.json" "$RUNNER_TEMP/pr.json" \
            "$RUNNER_TEMP/permission.json" "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          submission, pull, permission, event = (
              json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:]
          )
          actor = event["comment"]["user"]
          authority = permission.get("user", {})
          if permission.get("permission") not in {"write", "admin"}:
              raise SystemExit("curation submission requires write or admin permission")
          if (authority.get("id"), authority.get("login")) != (
              actor.get("id"), actor.get("login")
          ):
              raise SystemExit("collaborator permission does not match the commenter")
          labels = {item.get("name") for item in pull.get("labels", [])}
          expected = (
              event["repository"]["full_name"],
              event["issue"]["number"],
              pull.get("head", {}).get("sha"),
          )
          submitted = (
              submission["repository"],
              submission["pull_request"],
              submission["head_sha"],
          )
          if submitted != expected:
              raise SystemExit("submission is stale for this pull-request event")
          if (
              pull.get("state") != "open"
              or not pull.get("draft")
              or pull.get("base", {}).get("ref")
              != event["repository"]["default_branch"]
              or pull.get("head", {}).get("repo", {}).get("full_name")
              != event["repository"]["full_name"]
              or not pull.get("head", {}).get("ref", "").startswith(
                  "automation/curation/"
              )
              or "curation-review" not in labels
          ):
              raise SystemExit("comment does not target an open curation draft")
          values = {
              "actor": actor["login"],
              "actor_id": actor["id"],
              "comment_id": event["comment"]["id"],
              "comment_created_at": event["comment"]["created_at"],
              "comment_url": event["comment"]["html_url"],
              "head_ref": pull["head"]["ref"],
              "head_sha": pull["head"]["sha"],
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Inspect the submitted proposal coordinates
        id: proposal
        run: |
          python - "$RUNNER_TEMP/submission.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          submission = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          proposal = submission["proposal_sha"]
          if re.fullmatch(r"[0-9a-f]{40}", proposal) is None:
              raise SystemExit("submission proposal commit is invalid")
          coordinate = submission["source_coordinate"]
          adapter = submission["adapter"]
          if adapter == "dump-research-info":
              revision = coordinate.get("commit")
              if not isinstance(revision, str) or re.fullmatch(
                  r"[0-9a-f]{40}", revision
              ) is None:
                  raise SystemExit("dump source coordinate has no exact commit")
              library = ""
          else:
              library = coordinate.get("library_version")
              if isinstance(library, bool) or not isinstance(library, int) or library < 1:
                  raise SystemExit("Zotero source coordinate has no exact version")
              revision = ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"adapter={adapter}\n")
              stream.write(f"proposal_sha={proposal}\n")
              stream.write(f"source_revision={revision}\n")
              stream.write(f"library_version={library}\n")
          PY

      - name: Check out the exact pull-request head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: review
          persist-credentials: false
          ref: ${{ steps.pull.outputs.head_sha }}

      - name: Isolate the proposal parent and restrict later branch changes
        id: base
        env:
          ADAPTER: ${{ steps.proposal.outputs.adapter }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          PROPOSAL_SHA: ${{ steps.proposal.outputs.proposal_sha }}
        run: |
          set -euo pipefail
          test "$(git -C review rev-parse HEAD)" = "$HEAD_SHA"
          trusted_head_sha="$(git -C trusted rev-parse HEAD)"
          [[ "$trusted_head_sha" =~ ^[0-9a-f]{40}$ ]]
          parent="$(git -C review show -s --format=%P "$PROPOSAL_SHA")"
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]]
          git -C review merge-base --is-ancestor "$PROPOSAL_SHA" "$HEAD_SHA"
          git -C trusted merge-base --is-ancestor "$parent" HEAD
          pixi run --manifest-path trusted/pixi.toml python \
            trusted/.orinoco-lite/source-adapters/metadata/tools/curation.py \
            validate-review-history \
            --root "$GITHUB_WORKSPACE/review" \
            --proposal-sha "$PROPOSAL_SHA" \
            --head-sha "$HEAD_SHA" \
            > "$RUNNER_TEMP/review-history.json"
          base_root="$RUNNER_TEMP/proposal-base"
          git -C review worktree add --detach "$base_root" "$parent"
          git -C review show -s --format=%B "$PROPOSAL_SHA" \
            > "$RUNNER_TEMP/proposal-message.txt"
          python - "$RUNNER_TEMP/proposal-message.txt" \
            "$RUNNER_TEMP/submission.json" "$parent" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          message = Path(sys.argv[1]).read_text(encoding="utf-8")
          submission = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          marker = "=== Do not change lines below ==="
          if message.count(marker) != 1:
              raise SystemExit("proposal commit has no single inline DataLad record")
          human = message.split(marker, 1)[0]
          fields = {}
          for name in ("Adapter", "Adapter-Agent", "Metadata-Base", "Source"):
              matches = re.findall(rf"(?m)^Curation-{name}: (.+)$", human)
              if len(matches) != 1:
                  raise SystemExit(f"proposal commit has no single Curation-{name}")
              fields[name] = matches[0]
          if fields["Metadata-Base"] != sys.argv[3]:
              raise SystemExit("proposal run record names a different metadata base")
          if fields["Adapter"] != submission["adapter"]:
              raise SystemExit("proposal run record names a different adapter")
          try:
              source = json.loads(fields["Source"])
          except json.JSONDecodeError as error:
              raise SystemExit("proposal run record has invalid source JSON") from error
          canonical_source = json.dumps(
              source, ensure_ascii=False, separators=(",", ":"), sort_keys=True
          )
          if fields["Source"] != canonical_source:
              raise SystemExit("proposal run record source is not canonical JSON")
          if source != submission["source_coordinate"]:
              raise SystemExit("proposal run record names a different source")
          agent = fields["Adapter-Agent"]
          if not agent or agent != agent.strip() or "\n" in agent:
              raise SystemExit("proposal run record has an invalid adapter Agent PID")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"agent_pid={agent}\n")
          PY
          printf 'metadata_base=%s\n' "$parent" >> "$GITHUB_OUTPUT"
          printf 'root=%s\n' "$base_root" >> "$GITHUB_OUTPUT"
          printf 'trusted_head_sha=%s\n' "$trusted_head_sha" >> "$GITHUB_OUTPUT"
          test -z "$(git -C review config --local --get-regexp \
            'http\..*\.extraheader' || true)"

      - name: Resolve the proposal parent's released runtime
        id: runtime
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          pixi run --frozen --clean-env \
            --manifest-path "${{ steps.base.outputs.root }}/pixi.toml" \
            --executable orinoco \
            --root "${{ steps.base.outputs.root }}" runtime verify --json \
            > "$RUNNER_TEMP/runtime.json"
          python - "$RUNNER_TEMP/runtime.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = value.get("root")
          if not isinstance(root, str) or not Path(root).is_dir():
              raise SystemExit("proposal runtime did not resolve")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"root={root}\n")
          PY

      - name: Check out the exact submitted dump source as data
        if: steps.proposal.outputs.adapter == 'dump-research-info'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ steps.proposal.outputs.source_revision }}
          repository: con/dump-research-info

      - name: Rebuild and rehearse the complete finalization
        id: rehearsal
        env:
          ACTOR: ${{ steps.pull.outputs.actor }}
          ADAPTER: ${{ steps.proposal.outputs.adapter }}
          AGENT_PID: ${{ steps.base.outputs.agent_pid }}
          COMMENT_CREATED_AT: ${{ steps.pull.outputs.comment_created_at }}
          COMMENT_ID: ${{ steps.pull.outputs.comment_id }}
          COMMENT_URL: ${{ steps.pull.outputs.comment_url }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          LIBRARY_VERSION: ${{ steps.proposal.outputs.library_version }}
          METADATA_BASE: ${{ steps.base.outputs.metadata_base }}
          NUMBER: ${{ github.event.issue.number }}
          PROPOSAL_SHA: ${{ steps.proposal.outputs.proposal_sha }}
          REPOSITORY: ${{ github.repository }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          SOURCE_REVISION: ${{ steps.proposal.outputs.source_revision }}
          TRUSTED_HEAD_SHA: ${{ steps.base.outputs.trusted_head_sha }}
        run: |
          set -euo pipefail
          command=(
            pixi run --manifest-path trusted/pixi.toml python
            trusted/.orinoco-lite/source-adapters/metadata/tools/curation.py
            finalize
            --trusted-root "$GITHUB_WORKSPACE/trusted"
            --trusted-head-sha "$TRUSTED_HEAD_SHA"
            --base-root "${{ steps.base.outputs.root }}"
            --review-root "$GITHUB_WORKSPACE/review"
            --runtime-root "$RUNTIME_ROOT"
            --adapter "$ADAPTER"
            --adapter-agent-pid "$AGENT_PID"
            --metadata-base "$METADATA_BASE"
            --proposal-sha "$PROPOSAL_SHA"
            --head-sha "$HEAD_SHA"
            --repository "$REPOSITORY"
            --pull-request "$NUMBER"
            --comment "$RUNNER_TEMP/submission-comment.md"
            --reviewer "https://github.com/${ACTOR}"
            --reviewed-at "$COMMENT_CREATED_AT"
            --review-url "$COMMENT_URL"
            --review-ref "github-comment:${COMMENT_ID}"
            --scratch "${{ steps.base.outputs.root }}/build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
            --dry-run
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
            command+=(
              --source-checkout "$GITHUB_WORKSPACE/source"
              --source-revision "$SOURCE_REVISION"
            )
          else
            command+=(--expected-library-version "$LIBRARY_VERSION")
          fi
          unset GH_TOKEN GITHUB_TOKEN
          "${command[@]}" > "$RUNNER_TEMP/rehearsal.json"
          python - "$RUNNER_TEMP/rehearsal.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("candidate_count", 0) < 1:
              raise SystemExit("finalizer did not cover a complete candidate set")
          changed = report.get("metadata_changed")
          if not isinstance(changed, bool):
              raise SystemExit("finalizer returned invalid metadata state")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"metadata_changed={str(changed).lower()}\n")
              stream.write(f"cache_path={report['cache_path']}\n")
          PY

      - name: Apply metadata-changing finalization through DataLad
        if: steps.rehearsal.outputs.metadata_changed == 'true'
        env:
          ACTOR: ${{ steps.pull.outputs.actor }}
          ACTOR_ID: ${{ steps.pull.outputs.actor_id }}
          ADAPTER: ${{ steps.proposal.outputs.adapter }}
          AGENT_PID: ${{ steps.base.outputs.agent_pid }}
          CACHE_PATH: ${{ steps.rehearsal.outputs.cache_path }}
          COMMENT_CREATED_AT: ${{ steps.pull.outputs.comment_created_at }}
          COMMENT_ID: ${{ steps.pull.outputs.comment_id }}
          COMMENT_URL: ${{ steps.pull.outputs.comment_url }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          LIBRARY_VERSION: ${{ steps.proposal.outputs.library_version }}
          METADATA_BASE: ${{ steps.base.outputs.metadata_base }}
          NUMBER: ${{ github.event.issue.number }}
          PROPOSAL_SHA: ${{ steps.proposal.outputs.proposal_sha }}
          REPOSITORY: ${{ github.repository }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          SOURCE_REVISION: ${{ steps.proposal.outputs.source_revision }}
          TRUSTED_HEAD_SHA: ${{ steps.base.outputs.trusted_head_sha }}
        run: |
          set -euo pipefail
          git -C review config user.name github-actions[bot]
          git -C review config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          command=(
            python "$GITHUB_WORKSPACE/trusted/.orinoco-lite/source-adapters/metadata/tools/curation.py"
            finalize
            --trusted-root "$GITHUB_WORKSPACE/trusted"
            --trusted-head-sha "$TRUSTED_HEAD_SHA"
            --base-root "${{ steps.base.outputs.root }}"
            --review-root "$GITHUB_WORKSPACE/review"
            --runtime-root "$RUNTIME_ROOT"
            --adapter "$ADAPTER"
            --adapter-agent-pid "$AGENT_PID"
            --metadata-base "$METADATA_BASE"
            --proposal-sha "$PROPOSAL_SHA"
            --head-sha "$HEAD_SHA"
            --repository "$REPOSITORY"
            --pull-request "$NUMBER"
            --comment "$RUNNER_TEMP/submission-comment.md"
            --reviewer "https://github.com/${ACTOR}"
            --reviewed-at "$COMMENT_CREATED_AT"
            --review-url "$COMMENT_URL"
            --review-ref "github-comment:${COMMENT_ID}"
            --scratch "${{ steps.base.outputs.root }}/build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-checkout "$GITHUB_WORKSPACE/source"
              --source-revision "$SOURCE_REVISION"
            )
          else
            command+=(--expected-library-version "$LIBRARY_VERSION")
          fi
          message="chore(curation): record reviewed source metadata"
          author="${ACTOR} <${ACTOR_ID}+${ACTOR}@users.noreply.github.com>"
          unset GH_TOKEN GITHUB_TOKEN
          (
            cd review
            GIT_AUTHOR_NAME="$ACTOR" \
            GIT_AUTHOR_EMAIL="${ACTOR_ID}+${ACTOR}@users.noreply.github.com" \
            GIT_AUTHOR_DATE="$COMMENT_CREATED_AT" \
              pixi run --manifest-path "$GITHUB_WORKSPACE/trusted/pixi.toml" \
              datalad run --explicit \
              -m "$message" \
              -o site-specific/metadata/records \
              -o site-specific/metadata/overlays/annotations \
              -o "$CACHE_PATH" \
              -- "${command[@]}"
          )
          git -C review show -s --format='%an <%ae>' HEAD | grep -Fx "$author"

      - name: Apply a decision-cache-only finalization
        if: steps.rehearsal.outputs.metadata_changed == 'false'
        env:
          ACTOR: ${{ steps.pull.outputs.actor }}
          ACTOR_ID: ${{ steps.pull.outputs.actor_id }}
          ADAPTER: ${{ steps.proposal.outputs.adapter }}
          AGENT_PID: ${{ steps.base.outputs.agent_pid }}
          CACHE_PATH: ${{ steps.rehearsal.outputs.cache_path }}
          COMMENT_CREATED_AT: ${{ steps.pull.outputs.comment_created_at }}
          COMMENT_ID: ${{ steps.pull.outputs.comment_id }}
          COMMENT_URL: ${{ steps.pull.outputs.comment_url }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          LIBRARY_VERSION: ${{ steps.proposal.outputs.library_version }}
          METADATA_BASE: ${{ steps.base.outputs.metadata_base }}
          NUMBER: ${{ github.event.issue.number }}
          PROPOSAL_SHA: ${{ steps.proposal.outputs.proposal_sha }}
          REPOSITORY: ${{ github.repository }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          SOURCE_REVISION: ${{ steps.proposal.outputs.source_revision }}
          TRUSTED_HEAD_SHA: ${{ steps.base.outputs.trusted_head_sha }}
        run: |
          set -euo pipefail
          command=(
            pixi run --manifest-path trusted/pixi.toml python
            trusted/.orinoco-lite/source-adapters/metadata/tools/curation.py
            finalize
            --trusted-root "$GITHUB_WORKSPACE/trusted"
            --trusted-head-sha "$TRUSTED_HEAD_SHA"
            --base-root "${{ steps.base.outputs.root }}"
            --review-root "$GITHUB_WORKSPACE/review"
            --runtime-root "$RUNTIME_ROOT"
            --adapter "$ADAPTER"
            --adapter-agent-pid "$AGENT_PID"
            --metadata-base "$METADATA_BASE"
            --proposal-sha "$PROPOSAL_SHA"
            --head-sha "$HEAD_SHA"
            --repository "$REPOSITORY"
            --pull-request "$NUMBER"
            --comment "$RUNNER_TEMP/submission-comment.md"
            --reviewer "https://github.com/${ACTOR}"
            --reviewed-at "$COMMENT_CREATED_AT"
            --review-url "$COMMENT_URL"
            --review-ref "github-comment:${COMMENT_ID}"
            --scratch "${{ steps.base.outputs.root }}/build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-checkout "$GITHUB_WORKSPACE/source"
              --source-revision "$SOURCE_REVISION"
            )
          else
            command+=(--expected-library-version "$LIBRARY_VERSION")
          fi
          unset GH_TOKEN GITHUB_TOKEN
          "${command[@]}" > "$RUNNER_TEMP/finalization.json"
          git -C review config user.name github-actions[bot]
          git -C review config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C review add -- "$CACHE_PATH"
          author="${ACTOR} <${ACTOR_ID}+${ACTOR}@users.noreply.github.com>"
          GIT_AUTHOR_DATE="$COMMENT_CREATED_AT" git -C review commit \
            --author="$author" \
            -m "chore(curation): record reviewed source decisions" \
            -m "Curation-Trusted-Head: ${TRUSTED_HEAD_SHA}"

      - name: Validate the complete joined graph
        env:
          CACHE_PATH: ${{ steps.rehearsal.outputs.cache_path }}
        run: |
          set -euo pipefail
          test -z "$(git -C review status --porcelain --untracked-files=no)"
          git -C review diff --check HEAD^
          unset GH_TOKEN GITHUB_TOKEN
          git_bin="$RUNNER_TEMP/curation-system-bin"
          mkdir "$git_bin"
          system_git=/usr/bin/git
          test -f "$system_git"
          test -x "$system_git"
          ln -s "$system_git" "$git_bin/git"
          run_parent_orinoco() {
            pixi run --frozen --clean-env \
              --manifest-path "${{ steps.base.outputs.root }}/pixi.toml" \
              --executable /bin/sh -c '
                export PATH="$1:$PATH"
                export GIT_CONFIG_GLOBAL=/dev/null
                export GIT_CONFIG_NOSYSTEM=1
                export GIT_NO_REPLACE_OBJECTS=1
                export GIT_TERMINAL_PROMPT=0
                shift
                exec orinoco "$@"
              ' orinoco "$git_bin" "$@"
          }
          run_parent_orinoco --root "$GITHUB_WORKSPACE/review" projection update
          run_parent_orinoco --root "$GITHUB_WORKSPACE/review" validate
          git -C review show --name-only --format= HEAD | python -c '
          import os, sys
          from pathlib import PurePosixPath
          cache = PurePosixPath(os.environ["CACHE_PATH"])
          paths = [PurePosixPath(line.strip()) for line in sys.stdin if line.strip()]
          if cache not in paths:
              raise SystemExit("review commit omitted the compact decision cache")
          for path in paths:
              if (
                  path != cache
                  and path.parts[:2] != ("metadata", "records")
                  and path.parts[:3] != ("metadata", "overlays", "annotations")
              ):
                  raise SystemExit(f"review commit changed an unexpected path: {path}")
          '

      - name: Re-read the exact pull request and comment before writing
        env:
          ACTOR: ${{ steps.pull.outputs.actor }}
          COMMENT_ID: ${{ steps.pull.outputs.comment_id }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" > "$RUNNER_TEMP/pr-current.json"
          gh api "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
            > "$RUNNER_TEMP/comment-current.json"
          gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" \
            > "$RUNNER_TEMP/permission-current.json"
          python - "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr-current.json" \
            "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/comment-current.json" \
            "$RUNNER_TEMP/submission-comment.md" \
            "$RUNNER_TEMP/permission-current.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          original, current, event, comment, permission = (
              json.loads(Path(path).read_text(encoding="utf-8"))
              for path in (sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[6])
          )
          captured_comment = Path(sys.argv[5]).read_text(encoding="utf-8")
          repository = event["repository"]
          labels = {item.get("name") for item in current.get("labels", [])}
          if (
              current.get("state") != "open"
              or not current.get("draft")
              or current.get("number") != event["issue"]["number"]
              or current.get("base", {}).get("ref")
              != repository["default_branch"]
              or current.get("head", {}).get("repo", {}).get("full_name")
              != repository["full_name"]
              or current.get("head", {}).get("ref")
              != original.get("head", {}).get("ref")
              or current.get("head", {}).get("sha")
              != original.get("head", {}).get("sha")
              or "curation-review" not in labels
          ):
              raise SystemExit("curation pull-request coordinates changed during review")
          submitted_comment = event["comment"]
          expected_comment = (
              submitted_comment["id"],
              submitted_comment["user"]["id"],
              submitted_comment["user"]["login"],
              submitted_comment["body"],
              submitted_comment["created_at"],
              submitted_comment["updated_at"],
              submitted_comment["html_url"],
          )
          observed_comment = (
              comment.get("id"),
              comment.get("user", {}).get("id"),
              comment.get("user", {}).get("login"),
              comment.get("body"),
              comment.get("created_at"),
              comment.get("updated_at"),
              comment.get("html_url"),
          )
          if observed_comment != expected_comment or comment.get("body") != captured_comment:
              raise SystemExit("authenticated submission comment changed during review")
          authority = permission.get("user", {})
          if (
              permission.get("permission") not in {"write", "admin"}
              or authority.get("id") != submitted_comment["user"]["id"]
              or authority.get("login") != submitted_comment["user"]["login"]
          ):
              raise SystemExit("curator no longer has write or admin permission")
          PY

      - name: Push with an exact observed-head lease
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
        run: |
          # The job token also suppresses a recursive synchronize run. The
          # exact reviewed head receives the selected explicit dispatch next.
          git -C review merge-base --is-ancestor "$HEAD_SHA" HEAD
          test "$(git -C review rev-list --count "${HEAD_SHA}..HEAD")" = 1
          test "$(git -C review show -s --format=%P HEAD)" = "$HEAD_SHA"
          (cd review && gh auth setup-git)
          git -C review push \
            --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Dispatch selected validation for the exact reviewed ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          METADATA_CHANGED: ${{ steps.rehearsal.outputs.metadata_changed }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$METADATA_CHANGED" in
            true) validation=full ;;
            false) validation=joined ;;
            *)
              echo "Unexpected metadata_changed value: $METADATA_CHANGED" >&2
              exit 1
              ;;
          esac
          gh workflow run validate.yml \
            --repo "$REPOSITORY" \
            --ref "$HEAD_REF" \
            -f "validation=${validation}"

      - name: Dispatch exact-head SHACL Vue validation for the reviewed proposal
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head_sha="$(git -C review rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run shacl-vue-proposal.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "pull_request=${NUMBER}" \
            -f "expected_head=${head_sha}"

      - name: Post the finalization result
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          commit="$(git -C review rev-parse HEAD)"
          python - "$RUNNER_TEMP/result-comment.json" "$commit" \
            "$REPOSITORY" <<'PY'
          import json
          from pathlib import Path
          import sys

          repository = sys.argv[3]
          commit = sys.argv[2]
          commit_url = f"https://github.com/{repository}/commit/{commit}"
          body = (
              "Recorded human acceptance decisions in "
              f"[{commit[:12]}]({commit_url}). Ready for merging."
          )
          Path(sys.argv[1]).write_text(
              json.dumps({"body": body}, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          gh api "repos/${REPOSITORY}/issues/${NUMBER}/comments" \
            --method POST \
            --input "$RUNNER_TEMP/result-comment.json"
