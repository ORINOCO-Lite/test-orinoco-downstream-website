name: Curate source metadata

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Source adapter to review
        required: true
        type: choice
        options: [dump-research-info, zotero]
      source_refspec:
        description: Dump source refspec (branch, tag, or commit)
        required: false
        default: main
        type: string
      expected_library_version:
        description: Zotero snapshot library version (Zotero only)
        required: false
        type: string
      acknowledge_public_review_data:
        description: Metadata diff, form, reviewer identity, and decisions will be public
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions: {}

jobs:
  propose:
    name: Open one metadata curation PR
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository != 'con/orinoco-lite-template' &&
      github.run_attempt == 1 &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: curation-proposal-${{ inputs.adapter }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Read immutable workflow-run coordinates
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}" \
            > "$RUNNER_TEMP/workflow-run.json"
          python - "$RUNNER_TEMP/workflow-run.json" <<'PY'
          from datetime import datetime
          import json
          import os
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          started = datetime.fromisoformat(
              run["run_started_at"].replace("Z", "+00:00")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"as_of={started.date().isoformat()}\n")
          PY

      - name: Validate proposal inputs
        env:
          ACKNOWLEDGED: ${{ inputs.acknowledge_public_review_data }}
          ADAPTER: ${{ inputs.adapter }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          SOURCE_REFSPEC: ${{ inputs.source_refspec }}
        run: |
          python - <<'PY'
          import os
          import re

          if os.environ["ACKNOWLEDGED"] != "true":
              raise SystemExit("public review-data acknowledgment is required")
          adapter = os.environ["ADAPTER"]
          source_refspec = os.environ["SOURCE_REFSPEC"]
          library_version = os.environ["EXPECTED_LIBRARY_VERSION"]
          if adapter == "dump-research-info":
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", source_refspec):
                  raise SystemExit("dump source_refspec is not a valid refspec")
              if ".." in source_refspec or source_refspec.endswith("/"):
                  raise SystemExit("dump source_refspec contains an invalid ref")
              if library_version:
                  raise SystemExit("dump proposals do not use a Zotero version")
          elif adapter == "zotero":
              if not re.fullmatch(r"[1-9][0-9]*", library_version):
                  raise SystemExit("Zotero proposals require an exact library version")
              if source_refspec != "main":
                  raise SystemExit("Zotero proposals do not use a dump source refspec")
          else:
              raise SystemExit("unsupported adapter")
          PY

      - name: Install the trusted locked Pixi environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.73.0

      - name: Check out the selected dump source
        if: inputs.adapter == 'dump-research-info'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: build/curation/sources/dump-research-info
          persist-credentials: false
          ref: ${{ inputs.source_refspec }}
          repository: con/dump-research-info

      - name: Resolve the dump source to an exact commit
        if: inputs.adapter == 'dump-research-info'
        id: source
        run: |
          source_commit="$(
            git -C build/curation/sources/dump-research-info rev-parse HEAD
          )"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved dump source is not an exact commit" >&2
            exit 1
          fi
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Plan the metadata diff and render the review form
        id: plan
        env:
          ADAPTER: ${{ inputs.adapter }}
          AS_OF: ${{ steps.run.outputs.as_of }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          scratch="build/curation/${ADAPTER}/${GITHUB_RUN_ID}"
          command=(
            pixi run python
            source-adapters/metadata/tools/curation_github_prototype_v1.py
            plan
            --root .
            --adapter "$ADAPTER"
            --scratch "$scratch"
            --body "$RUNNER_TEMP/pr-body.md"
            --base-sha "$base_sha"
            --as-of "$AS_OF"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-path build/curation/sources/dump-research-info
              --source-revision "$SOURCE_COMMIT"
            )
          else
            command+=(--expected-library-version "$EXPECTED_LIBRARY_VERSION")
          fi
          "${command[@]}" > "$RUNNER_TEMP/plan.json"
          python - "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/pr-body.md" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          count = result.get("candidate_count", result.get("count"))
          if isinstance(count, bool) or not isinstance(count, int) or count < 0:
              raise SystemExit("helper returned an invalid candidate count")
          body = Path(sys.argv[2]).read_text(encoding="utf-8")
          notice = "**AI-generated draft — not reviewed by John**"
          if not body.startswith(notice + "\n"):
              raise SystemExit("review form lacks the required AI notice")
          if "<!-- orinoco-lite-curation-form-v1 " not in body:
              raise SystemExit("review form lacks its compact machine marker")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"candidate_count={count}\n")
              stream.write(f"has_candidates={str(count > 0).lower()}\n")
          if count == 0:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                  "a", encoding="utf-8"
              ) as stream:
                  stream.write(
                      "## No curation PR opened\n\n"
                      "The exact source proposal contained zero undecided changes.\n"
                  )
          PY
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'scratch=%s\n' "$scratch" >> "$GITHUB_OUTPUT"

      - name: Create the curation branch before recording metadata provenance
        if: steps.plan.outputs.has_candidates == 'true'
        id: branch
        env:
          ADAPTER: ${{ inputs.adapter }}
        run: |
          branch="automation/curation/${ADAPTER}-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          printf 'name=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Add proposed metadata with one native DataLad commit
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          ADAPTER: ${{ inputs.adapter }}
          AS_OF: ${{ steps.run.outputs.as_of }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          EXPECTED_LIBRARY_VERSION: ${{ inputs.expected_library_version }}
          SCRATCH: ${{ steps.plan.outputs.scratch }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          command=(
            pixi run python
            source-adapters/metadata/tools/curation_github_prototype_v1.py
            stage-proposal
            --root .
            --adapter "$ADAPTER"
            --scratch "$SCRATCH"
            --base-sha "$BASE_SHA"
            --as-of "$AS_OF"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-path build/curation/sources/dump-research-info
              --source-revision "$SOURCE_COMMIT"
            )
          else
            command+=(--expected-library-version "$EXPECTED_LIBRARY_VERSION")
          fi
          pixi run datalad run --explicit \
            -m "chore(curation): add ${ADAPTER} metadata proposal" \
            -o metadata/records \
            -- "${command[@]}"

          test "$(git rev-list --count "${BASE_SHA}..HEAD")" = 1
          test -z "$(git status --porcelain --untracked-files=no)"
          python - "$BASE_SHA" <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", sys.argv[1], "HEAD"],
          ).decode("utf-8").split("\0")
          paths = [PurePosixPath(path) for path in paths if path]
          if not paths or any(path.parts[:2] != ("metadata", "records") for path in paths):
              raise SystemExit("proposal commit changed a path outside metadata/records")
          PY

      - name: Push the native proposal commit
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Provision the curation review label
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh api "repos/${REPOSITORY}/labels/curation-review" \
            > /dev/null 2>&1; then
            gh label create curation-review \
              --color 5319E7 \
              --description "One-PR human metadata curation" \
              --repo "$REPOSITORY" || \
              gh api "repos/${REPOSITORY}/labels/curation-review" > /dev/null
          fi

      - name: Open one draft PR with the review form in its body
        if: steps.plan.outputs.has_candidates == 'true'
        env:
          ADAPTER: ${{ inputs.adapter }}
          BRANCH: ${{ steps.branch.outputs.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr create \
            --repo "$REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "chore(curation): review ${ADAPTER} metadata" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --label curation-review \
            --draft \
            | tee "$RUNNER_TEMP/pr-url.txt"
          {
            echo "## Curation PR opened"
            echo
            echo "$(<"$RUNNER_TEMP/pr-url.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Apply one completed review to the same PR
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.repository != 'con/orinoco-lite-template'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    concurrency:
      group: curation-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Recognize only the exact submit command
        id: command
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          )
          submit = event["comment"]["body"].strip() == "/curation submit"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"submit={str(submit).lower()}\n")
          PY

      - name: Preflight the draft PR and reviewer authority
        if: steps.command.outputs.submit == 'true'
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" > "$RUNNER_TEMP/pr.json"
          actor="$(python - "$GITHUB_EVENT_PATH" <<'PY'
          import json
          from pathlib import Path
          import sys

          event = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(event["comment"]["user"]["login"])
          PY
          )"
          gh api "repos/${REPOSITORY}/collaborators/${actor}/permission" \
            > "$RUNNER_TEMP/permission.json"
          python - "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/permission.json" \
            "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          pull = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          permission = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          event = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          actor = event["comment"]["user"]
          authority = permission.get("user", {})
          if permission.get("permission") not in {"write", "admin"}:
              raise SystemExit("curation submission requires write or admin permission")
          if (
              authority.get("id") != actor.get("id")
              or authority.get("login") != actor.get("login")
          ):
              raise SystemExit("reviewer permission does not match the commenter")
          labels = {label.get("name") for label in pull.get("labels", [])}
          if (
              pull.get("state") != "open"
              or not pull.get("draft")
              or pull.get("base", {}).get("ref")
              != event["repository"]["default_branch"]
              or pull.get("head", {}).get("repo", {}).get("full_name")
              != os.environ["GITHUB_REPOSITORY"]
              or not pull.get("head", {}).get("ref", "").startswith(
                  "automation/curation/"
              )
              or pull.get("user", {}).get("id") != 41898282
              or pull.get("user", {}).get("login") != "github-actions[bot]"
              or "curation-review" not in labels
          ):
              raise SystemExit("comment does not target an open bot curation draft")
          body = pull.get("body")
          if not isinstance(body, str):
              raise SystemExit("curation PR has no review form")
          Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_bytes(
              body.encode("utf-8")
          )
          values = {
              "actor": actor["login"],
              "actor_id": actor["id"],
              "base_sha": pull["base"]["sha"],
              "comment_created_at": event["comment"]["created_at"],
              "head_ref": pull["head"]["ref"],
              "head_sha": pull["head"]["sha"],
              "pr_url": pull["html_url"],
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Check out trusted current default-branch code
        if: steps.command.outputs.submit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out the exact PR head as review data
        if: steps.command.outputs.submit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: review
          persist-credentials: false
          ref: ${{ steps.pull.outputs.head_sha }}

      - name: Restrict the untrusted PR diff before using its data
        if: steps.command.outputs.submit == 'true'
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
        run: |
          test "$(git -C trusted rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C review rev-parse HEAD)" = "$HEAD_SHA"
          python - <<'PY'
          from pathlib import PurePosixPath
          import os
          import subprocess

          root = "review"
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", base, head], cwd=root
          ).decode("utf-8").split("\0")
          changed = [PurePosixPath(path) for path in changed if path]
          permitted = subprocess.check_output(
              [
                  "git", "diff", "--name-only", "-z", "--diff-filter=AM",
                  base, head,
              ],
              cwd=root,
          ).decode("utf-8").split("\0")
          permitted = [PurePosixPath(path) for path in permitted if path]
          if changed != permitted or not changed:
              raise SystemExit("proposal must contain only added or modified files")
          if any(path.parts[:2] != ("metadata", "records") for path in changed):
              raise SystemExit("proposal contains a path outside metadata/records")
          for path in changed:
              entry = subprocess.check_output(
                  ["git", "ls-tree", head, "--", path.as_posix()], cwd=root, text=True
              )
              if not entry.startswith("100644 blob "):
                  raise SystemExit(f"proposal path has a forbidden mode: {path}")
          count = subprocess.check_output(
              ["git", "rev-list", "--count", f"{base}..{head}"],
              cwd=root,
              text=True,
          ).strip()
          if count != "1":
              raise SystemExit("initial curation PR must contain one DataLad commit")
          PY

      - name: Install the trusted locked Pixi environment
        if: steps.command.outputs.submit == 'true'
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          manifest-path: trusted/pixi.toml
          pixi-version: v0.73.0

      - name: Inspect the completed form with trusted code
        if: steps.command.outputs.submit == 'true'
        id: form
        env:
          PULL_BASE_SHA: ${{ steps.pull.outputs.base_sha }}
        run: |
          pixi run --manifest-path trusted/pixi.toml python \
            trusted/source-adapters/metadata/tools/curation_github_prototype_v1.py \
            inspect-form \
            --body "$RUNNER_TEMP/pr-body.md" \
            > "$RUNNER_TEMP/form.json"
          python - "$RUNNER_TEMP/form.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          form = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          adapter = form.get("adapter")
          base_sha = form.get("base_sha")
          source = form.get("source", {})
          source_revision = source.get("revision", "")
          if adapter not in {"dump-research-info", "zotero"}:
              raise SystemExit("form has an unsupported adapter")
          if not isinstance(base_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", base_sha):
              raise SystemExit("form has an invalid base commit")
          if adapter == "dump-research-info" and (
              not isinstance(source_revision, str)
              or not re.fullmatch(r"[0-9a-f]{40}", source_revision)
          ):
              raise SystemExit("form has an invalid dump source commit")
          values = {
              "adapter": adapter,
              "base_sha": base_sha,
              "source_revision": source_revision,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY
          test "$PULL_BASE_SHA" = "$(
            python -c 'import json,sys; print(json.load(open(sys.argv[1]))["base_sha"])' \
              "$RUNNER_TEMP/form.json"
          )"

      - name: Check out the exact source named by the form
        if: >-
          steps.command.outputs.submit == 'true' &&
          steps.form.outputs.adapter == 'dump-research-info'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: trusted/build/curation/sources/dump-research-info
          persist-credentials: false
          ref: ${{ steps.form.outputs.source_revision }}
          repository: con/dump-research-info

      - name: Apply all form decisions with trusted code
        if: steps.command.outputs.submit == 'true'
        id: apply
        env:
          ACTOR: ${{ steps.pull.outputs.actor }}
          ADAPTER: ${{ steps.form.outputs.adapter }}
          COMMENT_CREATED_AT: ${{ steps.pull.outputs.comment_created_at }}
          NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pull.outputs.pr_url }}
          SOURCE_REVISION: ${{ steps.form.outputs.source_revision }}
        run: |
          set -euo pipefail
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            test "$(
              git -C trusted/build/curation/sources/dump-research-info rev-parse HEAD
            )" = "$SOURCE_REVISION"
          fi
          command=(
            pixi run --manifest-path trusted/pixi.toml python
            trusted/source-adapters/metadata/tools/curation_github_prototype_v1.py
            apply
            --trusted-root "$GITHUB_WORKSPACE/trusted"
            --review-root "$GITHUB_WORKSPACE/review"
            --adapter "$ADAPTER"
            --body "$RUNNER_TEMP/pr-body.md"
            --scratch "$GITHUB_WORKSPACE/trusted/build/curation/apply-${GITHUB_RUN_ID}"
            --reviewer "https://github.com/${ACTOR}"
            --reviewed-at "$COMMENT_CREATED_AT"
            --review-url "$PR_URL"
            --pull-request-number "$NUMBER"
          )
          if [[ "$ADAPTER" == "dump-research-info" ]]; then
            command+=(
              --source-path build/curation/sources/dump-research-info
              --source-revision "$SOURCE_REVISION"
            )
          fi
          "${command[@]}" > "$RUNNER_TEMP/apply.json"
          python - "$RUNNER_TEMP/apply.json" <<'PY'
          import json
          import os
          from pathlib import PurePosixPath, Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          counts = [result.get(key) for key in ("accepted", "rejected", "deferred")]
          if any(
              isinstance(value, bool) or not isinstance(value, int) or value < 0
              for value in counts
          ):
              raise SystemExit("helper returned invalid decision counts")
          if result.get("count") != sum(counts) or result["count"] < 1:
              raise SystemExit("helper did not apply one complete form")
          expected = PurePosixPath(
              "source-adapters", os.environ["ADAPTER"], "policy",
              "curation-decisions.yaml",
          )
          cache = PurePosixPath(result.get("cache_path", ""))
          source_coordinate = result.get("source_coordinate")
          if cache != expected:
              raise SystemExit("helper returned an unexpected decision-cache path")
          if (
              not isinstance(source_coordinate, str)
              or not source_coordinate
              or "\n" in source_coordinate
              or "\r" in source_coordinate
          ):
              raise SystemExit("helper returned an invalid source coordinate")
          if not Path(os.environ["GITHUB_WORKSPACE"], "review", cache).is_file():
              raise SystemExit("trusted helper did not write the decision cache")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"accepted={counts[0]}\n")
              stream.write(f"rejected={counts[1]}\n")
              stream.write(f"deferred={counts[2]}\n")
              stream.write(f"count={result['count']}\n")
              stream.write(f"cache_path={cache.as_posix()}\n")
              stream.write(f"source_coordinate={source_coordinate}\n")
          PY

      - name: Validate the reconciled metadata with the locked runtime
        if: steps.command.outputs.submit == 'true'
        env:
          ADAPTER: ${{ steps.form.outputs.adapter }}
        run: |
          set -euo pipefail
          git -C review diff --check
          python - <<'PY'
          from pathlib import PurePosixPath
          import os
          import subprocess

          changed = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"],
              cwd="review",
          ).decode("utf-8").split("\0")
          paths = [PurePosixPath(item[3:]) for item in changed if item]
          expected_cache = PurePosixPath(
              "source-adapters", os.environ["ADAPTER"], "policy",
              "curation-decisions.yaml",
          )
          if not paths or any(
              path != expected_cache and path.parts[:2] != ("metadata", "records")
              for path in paths
          ):
              raise SystemExit("apply changed a path outside metadata and its cache")
          if expected_cache not in paths:
              raise SystemExit("apply did not add or update the decision cache")
          PY
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/review" projection update
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/review" validate

      - name: Recheck the PR body before the commit and guarded push
        if: steps.command.outputs.submit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" > "$RUNNER_TEMP/pr-current.json"
          python - "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr-current.json" \
            "$RUNNER_TEMP/pr-body.md" <<'PY'
          import json
          from pathlib import Path
          import sys

          original = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          current = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          captured = Path(sys.argv[3]).read_bytes()
          body = current.get("body")
          if not isinstance(body, str) or body.encode("utf-8") != captured:
              raise SystemExit("review form changed while the submission was running")
          coordinates = (
              current.get("state"), current.get("draft"),
              current.get("base", {}).get("sha"),
              current.get("head", {}).get("ref"),
              current.get("head", {}).get("sha"),
          )
          expected = (
              "open", True, original["base"]["sha"],
              original["head"]["ref"], original["head"]["sha"],
          )
          if coordinates != expected:
              raise SystemExit("curation PR coordinates changed during submission")
          PY

      - name: Commit the decisions and reconciled metadata
        if: steps.command.outputs.submit == 'true'
        env:
          ACTOR: ${{ steps.pull.outputs.actor }}
          ACTOR_ID: ${{ steps.pull.outputs.actor_id }}
          ADAPTER: ${{ steps.form.outputs.adapter }}
          CACHE_PATH: ${{ steps.apply.outputs.cache_path }}
          REVIEWED_AT: ${{ steps.pull.outputs.comment_created_at }}
          REVIEW_URL: ${{ steps.pull.outputs.pr_url }}
          SOURCE_COORDINATE: ${{ steps.apply.outputs.source_coordinate }}
        run: |
          git -C review config user.name github-actions[bot]
          git -C review config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C review add -- metadata/records "$CACHE_PATH"
          git -C review diff --cached --quiet && {
            echo "completed review produced no commit" >&2
            exit 1
          }
          python - "$RUNNER_TEMP/curation-commit.txt" <<'PY'
          import os
          from pathlib import Path
          import sys

          values = {
              "Curation-Adapter": os.environ["ADAPTER"],
              "Curation-Source": os.environ["SOURCE_COORDINATE"],
              "Curation-Review": os.environ["REVIEW_URL"],
              "Curation-Reviewed-At": os.environ["REVIEWED_AT"],
          }
          if any(
              not value or "\n" in value or "\r" in value
              for value in values.values()
          ):
              raise SystemExit("curation commit trailer value is invalid")
          message = "chore(curation): record reviewed source metadata\n\n"
          message += "".join(f"{key}: {value}\n" for key, value in values.items())
          Path(sys.argv[1]).write_text(message, encoding="utf-8")
          PY
          author="${ACTOR} <${ACTOR_ID}+${ACTOR}@users.noreply.github.com>"
          GIT_AUTHOR_DATE="$REVIEWED_AT" git -C review commit \
            --author="$author" \
            --file="$RUNNER_TEMP/curation-commit.txt"

      - name: Push the review commit with an exact head lease
        if: steps.command.outputs.submit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
        run: |
          git -C review merge-base --is-ancestor "$HEAD_SHA" HEAD
          (cd review && gh auth setup-git)
          git -C review push \
            --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Dispatch validation for the reviewed head
        if: steps.command.outputs.submit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run validate.yml --repo "$REPOSITORY" --ref "$HEAD_REF"

      - name: Post a compact attributed submission summary
        if: steps.command.outputs.submit == 'true'
        env:
          ACCEPTED: ${{ steps.apply.outputs.accepted }}
          CACHE_PATH: ${{ steps.apply.outputs.cache_path }}
          DEFERRED: ${{ steps.apply.outputs.deferred }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REJECTED: ${{ steps.apply.outputs.rejected }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export REVIEW_COMMIT="$(git -C review rev-parse HEAD)"
          python - "$RUNNER_TEMP/comment.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          body = (
              "**AI-generated draft — not reviewed by John**\n\n"
              "Applied the completed curation form in "
              f"`{os.environ['REVIEW_COMMIT']}`: "
              f"{os.environ['ACCEPTED']} accepted, "
              f"{os.environ['REJECTED']} rejected, and "
              f"{os.environ['DEFERRED']} deferred.\n\n"
              f"Decision provenance: `{os.environ['CACHE_PATH']}`. "
              "Validation was dispatched for the updated PR head."
          )
          Path(sys.argv[1]).write_text(
              json.dumps({"body": body}, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          gh api "repos/${REPOSITORY}/issues/${NUMBER}/comments" \
            --method POST \
            --input "$RUNNER_TEMP/comment.json"
