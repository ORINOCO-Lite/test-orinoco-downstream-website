name: Validate downstream site

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Validate (macOS 14 ARM64)
    if: >-
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      ((github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'automation/curation/')) ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch')
    uses: ORINOCO-Lite/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@2b113229b10cf8b2a44cb89b30793261628641ee
    with:
      pixi-version: v0.73.0
      runner: macos-14
  linux:
    name: Validate (Linux x86-64)
    if: >-
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      ((github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'automation/curation/')) ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch')
    uses: ORINOCO-Lite/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@2b113229b10cf8b2a44cb89b30793261628641ee
    with:
      pixi-version: v0.73.0
      runner: ubuntu-24.04
      artifact-name: static-site-${{ github.sha }}
      artifact-path: build/site
