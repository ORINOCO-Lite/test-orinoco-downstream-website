name: Validate downstream site

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      ((github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'automation/curation/')) ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
      - name: Validate and build
        run: |
          pixi run validate
          pixi run verify-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: static-site-${{ github.sha }}
          path: build/site
          if-no-files-found: error
          retention-days: 14
