name: Materialize SHACL Vue proposal

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Draft pull request to validate after trusted replacement
        required: true
        type: number
      expected_head:
        description: Exact replacement commit produced by the trusted workflow
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Materialize or validate one explicit human edit
    if: >-
      github.repository != 'con/orinoco-lite-template' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.draft &&
        github.event.pull_request.base.ref ==
        github.event.repository.default_branch &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.run_attempt == 1 &&
        github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    concurrency:
      group: shacl-vue-proposal-${{ github.event.pull_request.number || inputs.pull_request }}
      cancel-in-progress: false
    steps:
      - name: Resolve exact pull request and attributed head
        id: coordinates
        env:
          DISPATCH_HEAD: ${{ inputs.expected_head }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            expected_head="$EVENT_HEAD_SHA"
            trusted_sha="$EVENT_BASE_SHA"
          else
            expected_head="$DISPATCH_HEAD"
            trusted_sha="$WORKFLOW_SHA"
          fi
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" \
            > "$RUNNER_TEMP/shacl-vue-pr.json"
          gh api "repos/${REPOSITORY}/commits/${expected_head}" \
            > "$RUNNER_TEMP/shacl-vue-head.json"
          python - "$RUNNER_TEMP/shacl-vue-pr.json" \
            "$RUNNER_TEMP/shacl-vue-head.json" "$expected_head" \
            "$trusted_sha" <<'PY'
          from datetime import datetime
          import json
          import os
          from pathlib import Path
          import re
          import sys

          pull = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          commit = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_head = sys.argv[3]
          trusted_sha = sys.argv[4]
          repository = os.environ["REPOSITORY"]
          base = pull.get("base", {})
          head = pull.get("head", {})
          if (
              pull.get("state") != "open"
              or not pull.get("draft")
              or pull.get("number") != int(os.environ["NUMBER"])
              or base.get("ref") != base.get("repo", {}).get("default_branch")
              or base.get("repo", {}).get("full_name") != repository
              or head.get("repo", {}).get("full_name") != repository
              or head.get("sha") != expected_head
              or base.get("sha") != trusted_sha
              or commit.get("sha") != expected_head
              or not isinstance(head.get("ref"), str)
              or not head["ref"]
              or any(character in head["ref"] for character in "\r\n\0")
          ):
              raise SystemExit("pull request no longer matches the exact trigger")
          parents = commit.get("parents")
          if not isinstance(parents, list) or len(parents) != 1:
              parent = ""
          else:
              parent = parents[0].get("sha", "")
          author = commit.get("author")
          eligible = (
              isinstance(author, dict)
              and author.get("type") == "User"
              and isinstance(author.get("id"), int)
              and author["id"] > 0
              and isinstance(author.get("login"), str)
              and re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})", author["login"])
              is not None
              and re.fullmatch(r"[0-9a-f]{40}", parent) is not None
          )
          git_author = commit.get("commit", {}).get("author", {})
          author_date = git_author.get("date", "")
          try:
              parsed_date = datetime.fromisoformat(author_date.replace("Z", "+00:00"))
          except (AttributeError, ValueError):
              parsed_date = None
          if parsed_date is None or parsed_date.tzinfo is None:
              eligible = False
          sender_match = False
          if eligible and os.environ["EVENT_NAME"] == "pull_request_target":
              sender_match = (
                  os.environ["EVENT_SENDER"] == author["login"]
                  and os.environ["EVENT_SENDER_ID"] == str(author["id"])
              )
          labels = {
              item.get("name")
              for item in pull.get("labels", [])
              if isinstance(item, dict)
          }
          values = {
              "author_date": author_date if eligible else "",
              "base_sha": base["sha"],
              "curator": author["login"] if eligible else "",
              "curator_id": str(author["id"]) if eligible else "",
              "default_branch": base["ref"],
              "eligible": str(eligible).lower(),
              "event_author_match": str(sender_match).lower(),
              "head_ref": head["ref"],
              "head_sha": expected_head,
              "is_curation": str("curation-review" in labels).lower(),
              "number": os.environ["NUMBER"],
              "parent_sha": parent,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              for name, value in values.items():
                  out.write(f"{name}={value}\n")
          PY

      - name: Check out exact trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ steps.coordinates.outputs.base_sha }}

      - name: Check out exact proposal head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: proposal
          persist-credentials: false
          ref: ${{ steps.coordinates.outputs.head_sha }}

      - name: Classify the fixed handoff or canonical metadata head
        id: inspect
        env:
          BASE_SHA: ${{ steps.coordinates.outputs.base_sha }}
          HEAD_SHA: ${{ steps.coordinates.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C proposal rev-parse HEAD)" = "$HEAD_SHA"
          python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
            inspect \
            --root "$GITHUB_WORKSPACE/proposal" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            > "$RUNNER_TEMP/shacl-vue-inspection.json"
          python - "$RUNNER_TEMP/shacl-vue-inspection.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          phase = value.get("phase")
          if phase not in {"handoff", "canonical", "irrelevant"}:
              raise SystemExit("handoff inspection returned invalid state")
          parent = value.get("parent_sha", "")
          if not isinstance(parent, str) or len(parent) != 40:
              raise SystemExit("handoff inspection returned invalid parent")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"phase={phase}\n")
              out.write(f"parent_sha={parent}\n")
          PY

      - name: Verify the attributed curator remains authorized
        id: authority
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          CURATOR: ${{ steps.coordinates.outputs.curator }}
          CURATOR_ID: ${{ steps.coordinates.outputs.curator_id }}
          ELIGIBLE: ${{ steps.coordinates.outputs.eligible }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$ELIGIBLE" != "true" ]]; then
            printf 'authorized=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${REPOSITORY}/collaborators/${CURATOR}/permission" \
            > "$RUNNER_TEMP/shacl-vue-permission.json"
          python - "$RUNNER_TEMP/shacl-vue-permission.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          user = value.get("user", {})
          authorized = (
              value.get("permission") in {"write", "admin"}
              and user.get("login") == os.environ["CURATOR"]
              and str(user.get("id", "")) == os.environ["CURATOR_ID"]
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"authorized={str(authorized).lower()}\n")
          PY

      - name: Enforce the authenticated exact-head handoff boundary
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          AUTHORIZED: ${{ steps.authority.outputs.authorized }}
          BASE_SHA: ${{ steps.coordinates.outputs.base_sha }}
          ELIGIBLE: ${{ steps.coordinates.outputs.eligible }}
          EVENT_AUTHOR_MATCH: ${{ steps.coordinates.outputs.event_author_match }}
          EVENT_NAME: ${{ github.event_name }}
          IS_CURATION: ${{ steps.coordinates.outputs.is_curation }}
          PARENT_SHA: ${{ steps.inspect.outputs.parent_sha }}
          PHASE: ${{ steps.inspect.outputs.phase }}
        run: |
          set -euo pipefail
          [[ "$ELIGIBLE" == "true" && "$AUTHORIZED" == "true" ]]
          [[ "$PHASE" == "handoff" ]]
          [[ "$EVENT_NAME" == "pull_request_target" ]]
          [[ "$EVENT_AUTHOR_MATCH" == "true" ]]
          if [[ "$IS_CURATION" != "true" ]]; then
            [[ "$PARENT_SHA" == "$BASE_SHA" ]]
          fi

      - name: Install the trusted locked Pixi environment
        if: steps.inspect.outputs.phase != 'irrelevant'
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          manifest-path: trusted/pixi.toml
          pixi-version: v0.73.0

      - name: Create an isolated exact-parent metadata checkout
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          SOURCE_COMMIT: ${{ steps.inspect.outputs.parent_sha }}
        run: |
          set -euo pipefail
          git -C proposal worktree add --detach \
            "$GITHUB_WORKSPACE/source" "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

      - name: Extract and apply the unchanged version 2 bundle
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          HEAD_SHA: ${{ steps.coordinates.outputs.head_sha }}
          SOURCE_COMMIT: ${{ steps.inspect.outputs.parent_sha }}
        run: |
          set -euo pipefail
          python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
            extract \
            --root "$GITHUB_WORKSPACE/proposal" \
            --head-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/shacl-vue-review-bundle.json" \
            > "$RUNNER_TEMP/shacl-vue-extract.json"
          unset GH_TOKEN GITHUB_TOKEN
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/source" runtime verify --json \
            > "$RUNNER_TEMP/shacl-vue-runtime.json"
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/source" editor apply \
            "$RUNNER_TEMP/shacl-vue-review-bundle.json" --write \
            > "$RUNNER_TEMP/shacl-vue-apply.json"
          python - "$RUNNER_TEMP/shacl-vue-apply.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              value.get("format") != "orinoco-editor-apply-report"
              or value.get("version") != 1
              or value.get("applied") is not True
              or not value.get("changed_paths")
          ):
              raise SystemExit("trusted editor did not materialize a metadata change")
          PY
          python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
            inspect-materialized \
            --root "$GITHUB_WORKSPACE/source" \
            --source-commit "$SOURCE_COMMIT" \
            > "$RUNNER_TEMP/shacl-vue-materialized.json"

      - name: Validate the materialized joined graph
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          SOURCE_COMMIT: ${{ steps.inspect.outputs.parent_sha }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/source" projection update
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/source" validate
          python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
            inspect-materialized \
            --root "$GITHUB_WORKSPACE/source" \
            --source-commit "$SOURCE_COMMIT" \
            > "$RUNNER_TEMP/shacl-vue-validated.json"

      - name: Create the equivalent attributed human metadata commit
        if: steps.inspect.outputs.phase == 'handoff'
        id: materialized
        env:
          AUTHOR_DATE: ${{ steps.coordinates.outputs.author_date }}
          CURATOR: ${{ steps.coordinates.outputs.curator }}
          CURATOR_ID: ${{ steps.coordinates.outputs.curator_id }}
          SOURCE_COMMIT: ${{ steps.inspect.outputs.parent_sha }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          git -C source add -A -- \
            metadata/records metadata/overlays/annotations
          python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
            inspect-materialized \
            --root "$GITHUB_WORKSPACE/source" \
            --source-commit "$SOURCE_COMMIT" \
            > "$RUNNER_TEMP/shacl-vue-staged.json"
          test -z "$(git -C source diff --name-only)"
          git -C source diff --cached --check
          GIT_AUTHOR_NAME="$CURATOR" \
          GIT_AUTHOR_EMAIL="${CURATOR_ID}+${CURATOR}@users.noreply.github.com" \
          GIT_AUTHOR_DATE="$AUTHOR_DATE" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git -C source commit -m "feat(metadata): apply SHACL Vue edit"
          replacement="$(git -C source rev-parse HEAD)"
          [[ "$replacement" =~ ^[0-9a-f]{40}$ ]]
          python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
            verify-commit \
            --root "$GITHUB_WORKSPACE/source" \
            --source-commit "$SOURCE_COMMIT" \
            --commit "$replacement" \
            > "$RUNNER_TEMP/shacl-vue-commit.json"
          test "$(git -C source show -s --format=%an HEAD)" = "$CURATOR"
          test "$(git -C source show -s --format=%ae HEAD)" = \
            "${CURATOR_ID}+${CURATOR}@users.noreply.github.com"
          test "$(git -C source show -s --format=%cn HEAD)" = \
            "github-actions[bot]"
          test "$(git -C source show -s --format=%ce HEAD)" = \
            "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'sha=%s\n' "$replacement" >> "$GITHUB_OUTPUT"

      - name: Replace only the exact handoff head with a lease
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          CURATOR: ${{ steps.coordinates.outputs.curator }}
          CURATOR_ID: ${{ steps.coordinates.outputs.curator_id }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF_SHA: ${{ steps.coordinates.outputs.head_sha }}
          HEAD_REF: ${{ steps.coordinates.outputs.head_ref }}
          NUMBER: ${{ steps.coordinates.outputs.number }}
          REPLACEMENT_SHA: ${{ steps.materialized.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.inspect.outputs.parent_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" \
            > "$RUNNER_TEMP/shacl-vue-pr-current.json"
          gh api "repos/${REPOSITORY}/commits/${HANDOFF_SHA}" \
            > "$RUNNER_TEMP/shacl-vue-head-current.json"
          gh api "repos/${REPOSITORY}/collaborators/${CURATOR}/permission" \
            > "$RUNNER_TEMP/shacl-vue-permission-current.json"
          python - "$RUNNER_TEMP/shacl-vue-pr-current.json" \
            "$RUNNER_TEMP/shacl-vue-head-current.json" \
            "$RUNNER_TEMP/shacl-vue-permission-current.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          pull = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          commit = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          permission = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          authority = permission.get("user", {})
          if (
              pull.get("state") != "open"
              or not pull.get("draft")
              or pull.get("base", {}).get("ref")
              != pull.get("base", {}).get("repo", {}).get("default_branch")
              or pull.get("base", {}).get("repo", {}).get("full_name")
              != os.environ["REPOSITORY"]
              or pull.get("head", {}).get("sha") != os.environ["HANDOFF_SHA"]
              or pull.get("head", {}).get("ref") != os.environ["HEAD_REF"]
              or pull.get("head", {}).get("repo", {}).get("full_name")
              != os.environ["REPOSITORY"]
              or commit.get("sha") != os.environ["HANDOFF_SHA"]
              or commit.get("author", {}).get("login") != os.environ["CURATOR"]
              or str(commit.get("author", {}).get("id", ""))
              != os.environ["CURATOR_ID"]
              or permission.get("permission") not in {"write", "admin"}
              or authority.get("login") != os.environ["CURATOR"]
              or str(authority.get("id", "")) != os.environ["CURATOR_ID"]
          ):
              raise SystemExit("handoff head or curator authority changed before push")
          PY
          git -C source merge-base --is-ancestor \
            "$SOURCE_COMMIT" "$REPLACEMENT_SHA"
          test "$(git -C source rev-list --count \
            "${SOURCE_COMMIT}..${REPLACEMENT_SHA}")" = 1
          test "$(git -C source show -s --format=%P "$REPLACEMENT_SHA")" = \
            "$SOURCE_COMMIT"
          (cd source && gh auth setup-git)
          git -C source push \
            --force-with-lease="refs/heads/${HEAD_REF}:${HANDOFF_SHA}" \
            "https://github.com/${REPOSITORY}.git" \
            "${REPLACEMENT_SHA}:refs/heads/${HEAD_REF}"

      - name: Retrigger trusted validation at the replacement head
        if: steps.inspect.outputs.phase == 'handoff'
        env:
          DEFAULT_BRANCH: ${{ steps.coordinates.outputs.default_branch }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.coordinates.outputs.number }}
          REPLACEMENT_SHA: ${{ steps.materialized.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" \
            --jq '.head.sha' | grep -Fx "$REPLACEMENT_SHA"
          gh workflow run shacl-vue-proposal.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "pull_request=${NUMBER}" \
            -f "expected_head=${REPLACEMENT_SHA}"

      - name: Validate the exact canonical joined metadata graph
        if: steps.inspect.outputs.phase == 'canonical'
        env:
          HEAD_SHA: ${{ steps.coordinates.outputs.head_sha }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          test "$(git -C proposal rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git -C proposal status --porcelain --untracked-files=no)"
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/proposal" projection update
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/proposal" validate
          test -z "$(git -C proposal status --porcelain --untracked-files=no)"

      - name: Build exact-head SHACL Vue presentation input
        if: steps.inspect.outputs.phase == 'canonical'
        env:
          HEAD_SHA: ${{ steps.coordinates.outputs.head_sha }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          site="$GITHUB_WORKSPACE/proposal/build/shacl-vue-exact-head"
          stage="$RUNNER_TEMP/shacl-vue-editor-input"
          pixi run --manifest-path trusted/pixi.toml orinoco \
            --root "$GITHUB_WORKSPACE/proposal" build \
            --destination "$site" --base-url /
          for path in \
            edit/config.json \
            edit/records.ttl \
            edit/data/record-sources.json
          do
            test -f "$site/$path" && test ! -L "$site/$path"
            install -D -m 0644 "$site/$path" "$stage/$path"
          done
          python - "$stage" "$HEAD_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = {
              "edit/config.json",
              "edit/data/record-sources.json",
              "edit/records.ttl",
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          if actual != expected or any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("editor input staging contains unexpected paths")
          catalog = json.loads(
              (root / "edit/data/record-sources.json").read_text(encoding="utf-8")
          )
          if catalog.get("source_commit") != sys.argv[2]:
              raise SystemExit("editor input is not bound to the exact PR head")
          PY
          test -z "$(git -C proposal status --porcelain --untracked-files=no)"

      - name: Upload the expiring exact-head SHACL Vue input
        if: steps.inspect.outputs.phase == 'canonical'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orinoco-shacl-vue-input-${{ steps.coordinates.outputs.head_sha }}
          path: ${{ runner.temp }}/shacl-vue-editor-input/
          if-no-files-found: error
          include-hidden-files: false

      - name: Re-read the canonical head and add the curation-service link
        if: steps.inspect.outputs.phase == 'canonical'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.coordinates.outputs.head_sha }}
          NUMBER: ${{ steps.coordinates.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_APP_ORIGIN: ${{ vars.CURATION_REVIEW_APP_ORIGIN || 'https://orinoco-curation-review.pages.dev/' }}
        run: |
          set -euo pipefail
          review_url="$(
            python trusted/source-adapters/metadata/tools/shacl_vue_handoff.py \
              review-url \
              --origin "$REVIEW_APP_ORIGIN" \
              --repository "$REPOSITORY" \
              --pull-request "$NUMBER" \
              --expected-head-sha "$HEAD_SHA"
          )"
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" \
            > "$RUNNER_TEMP/shacl-vue-canonical-current.json"
          gh api "repos/${REPOSITORY}/issues/${NUMBER}/comments?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/shacl-vue-comments.json"
          python - "$RUNNER_TEMP/shacl-vue-canonical-current.json" \
            "$RUNNER_TEMP/shacl-vue-comments.json" \
            "$RUNNER_TEMP/shacl-vue-comment.md" "$review_url" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          pull = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pages = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if (
              pull.get("state") != "open"
              or not pull.get("draft")
              or pull.get("base", {}).get("ref")
              != pull.get("base", {}).get("repo", {}).get("default_branch")
              or pull.get("base", {}).get("repo", {}).get("full_name")
              != os.environ["REPOSITORY"]
              or pull.get("head", {}).get("sha") != os.environ["HEAD_SHA"]
              or pull.get("head", {}).get("repo", {}).get("full_name")
              != os.environ["REPOSITORY"]
          ):
              raise SystemExit("canonical pull-request head changed")
          comments = [item for page in pages for item in page]
          body = pull.get("body") or ""
          already_linked = sys.argv[4] in body or any(
              sys.argv[4] in str(comment.get("body") or "") for comment in comments
          )
          if not already_linked:
              Path(sys.argv[3]).write_text(
                  "**AI-generated draft — not reviewed by John**\n\n"
                  "The trusted workflow validated the joined metadata graph at "
                  f"`{os.environ['HEAD_SHA']}`.\n\n"
                  f"[Continue curation in Orinoco]({sys.argv[4]})\n\n"
                  "<!-- orinoco-shacl-vue-proposal -->\n",
                  encoding="utf-8",
              )
          PY
          if [[ -f "$RUNNER_TEMP/shacl-vue-comment.md" ]]; then
            gh api --method POST \
              "repos/${REPOSITORY}/issues/${NUMBER}/comments" \
              -F "body=@$RUNNER_TEMP/shacl-vue-comment.md" > /dev/null
          fi

  default-editor:
    name: Publish exact default-head SHACL Vue input
    if: >-
      github.event_name == 'push' &&
      github.repository != 'con/orinoco-lite-template' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: shacl-vue-default-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out exact trusted default head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install the trusted locked Pixi environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.73.0

      - name: Validate and build exact default-head presentation input
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          pixi run orinoco --root . projection update
          pixi run orinoco --root . validate
          site="$GITHUB_WORKSPACE/build/shacl-vue-exact-default"
          stage="$RUNNER_TEMP/shacl-vue-editor-input"
          pixi run orinoco --root . build \
            --destination "$site" --base-url /
          for path in \
            edit/config.json \
            edit/records.ttl \
            edit/data/record-sources.json
          do
            test -f "$site/$path" && test ! -L "$site/$path"
            install -D -m 0644 "$site/$path" "$stage/$path"
          done
          python - "$stage" "$SOURCE_COMMIT" <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = {
              "edit/config.json",
              "edit/data/record-sources.json",
              "edit/records.ttl",
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          if actual != expected or any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("editor input staging contains unexpected paths")
          catalog = json.loads(
              (root / "edit/data/record-sources.json").read_text(encoding="utf-8")
          )
          if catalog.get("source_commit") != sys.argv[2]:
              raise SystemExit("editor input is not bound to the exact default head")
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload the expiring exact-default SHACL Vue input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orinoco-shacl-vue-input-${{ github.sha }}
          path: ${{ runner.temp }}/shacl-vue-editor-input/
          if-no-files-found: error
          include-hidden-files: false
