description: A person, family, or organization responsible for creating a work that
  is primarily textual in content, regardless of media type (e.g., printed text, spoken
  word, electronic text, tactile text) or genre (e.g., poems, novels, screenplays,
  blogs). Use also for persons, etc., creating a new work by paraphrasing, rewriting,
  or adapting works by another creator such that the modification has substantially
  changed the nature and content of the original or changed the medium of expression
display_label: Author
display_note: More specific roles, such as 'first/senior author' should be used in
  the context of academic publications.
pid: marcrel:aut
schema_type: xyzri:XYZAgentRole
