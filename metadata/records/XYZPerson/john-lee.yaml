description: >-
  John brings together research imaging, open-source infrastructure, and an
  industry engineering perspective. His work spans NIH neuroimaging data
  sharing, AFNI testing infrastructure, consulting and independent software
  work, and reproducible biomedical image transformation. At CON, he works on
  building and applying the center's tools for reproducibility and provenance
  tracking to healthcare image data, with an interest in auditable autonomous
  systems for scientific research and clinical translation.
