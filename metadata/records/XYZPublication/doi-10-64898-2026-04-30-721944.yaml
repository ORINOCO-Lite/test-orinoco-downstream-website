title: Open neuroinformatics infrastructure ecosystem for federated multisite studies
display_label: Open neuroinformatics infrastructure ecosystem for federated multisite studies
description: "Abstract\n          Despite growing understanding of the benefits of having\
  \ Findable, Accessible, Interoperable, and Reusable (FAIR) data, many datasets still cannot\
  \ be shared. Federated analysis methods can enable multisite studies that do not require\
  \ the sharing of participant-level information. However, there are many practical hurdles\
  \ that prevent the large-scale adoption of federated methods. We discuss challenges related\
  \ to cross-site data preparation for federated learning, present solutions offered by recent\
  \ neuroinformatics projects, and showcase an example of tool integration applied to neurodegenerative\
  \ disease data."
