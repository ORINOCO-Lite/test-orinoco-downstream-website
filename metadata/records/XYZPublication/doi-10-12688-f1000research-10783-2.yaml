description: Reproducible research is a key element of the scientific process. Re-executability
  of neuroimaging workflows that lead to the conclusions arrived at in the literature
  has not yet been sufficiently addressed and adopted by the neuroimaging community.
  In this paper, we document a set of procedures, which include supplemental additions
  to a manuscript, that unambiguously define the data, workflow, execution environment
  and results of a neuroimaging analysis, in order to generate a verifiable re-executable
  publication. Re-executability provides a starting point for examination of the generalizability
  and reproducibility of a given finding.
display_label: A very simple, re-executable neuroimaging publication
