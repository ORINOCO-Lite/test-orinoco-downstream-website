description: The Brain Imaging Data Structure (BIDS) is an increasingly adopted standard
  for organizing scientific data and metadata. It facilitates easier and more straightforward
  data sharing and reuse. BIDS currently encompasses several biomedical imaging and
  non-imaging techniques, and as more research groups begin to use it, additional
  experimental techniques are being incorporated into the standard, allowing diverse
  experimental methods to be stored within the same cohesive structure. Here, we present
  an extension for magnetic resonance spectroscopy (MRS) data, termed MRS-BIDS.
display_label: MRS-BIDS, an extension to the Brain Imaging Data Structure for magnetic
  resonance spectroscopy
