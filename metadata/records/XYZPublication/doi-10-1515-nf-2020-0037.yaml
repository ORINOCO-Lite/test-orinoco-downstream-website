description: "Abstract\n            Decentralized research data management (dRDM)\
  \ systems handle digital research objects across participating nodes without critically\
  \ relying on central services. We present four perspectives in defense of dRDM,\
  \ illustrating that, in contrast to centralized or federated research data management\
  \ solutions, a dRDM system based on heterogeneous but interoperable components can\
  \ offer a sustainable, resilient, inclusive, and adaptive infrastructure for scientific\
  \ stakeholders: An individual scientist or laboratory, a research institute, a domain\
  \ data archive or cloud computing platform, and a collaborative multisite consortium.\
  \ All perspectives share the use of a common, self-contained, portable data structure\
  \ as an abstraction from current technology and service choices. In conjunction,\
  \ the four perspectives review how varying requirements of independent scientific\
  \ stakeholders can be addressed by a scalable, uniform dRDM solution and present\
  \ a working system as an exemplary implementation."
display_label: In defense of decentralized research data management
