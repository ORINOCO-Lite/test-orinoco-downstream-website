title: Dense mode clustering in brain maps
display_label: Dense mode clustering in brain maps
description: A mode-based clustering method is developed for identifying spatially dense clusters
  in brain maps. This type of clustering focuses on identifying clusters in brain maps independent
  of their shape or overall variance. This can be useful for both localization in terms of
  interpretation and for subsequent graphical analysis that might require more coherent or
  dense regions of interest as starting points. The method automatically does signal/noise
  sharpening through density mode seeking. We also discuss the problem of parameter selection
  with this method and propose a new method involving 2-parameter control surface, in which
  we show that the same cluster solution results from tradeoff of these 2 parameters (the
  local density k and the radius r of the spherical kernel). We benchmark the new dense mode
  clustering by using several artificially created data sets and brain imaging data sets from
  an event perception task by perturbing the data set with noise and measuring three kinds
  of deviation from the original cluster solution. We present benchmark results that demonstrate
  that the mode clustering method consistently outperforms the commonly used single-linkage
  clustering, k means method (centroid method) and Ward's method (variance method).
