- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: "Abstract\n            As data sharing has become more prevalent, three pillars\
    \ - archives, standards, and analysis tools - have emerged as critical components\
    \ in facilitating effective data sharing and collaboration. This paper compares\
    \ four freely available intracranial neuroelectrophysiology data repositories:\
    \ Data Archive for the BRAIN Initiative (DABI), Distributed Archives for Neurophysiology\
    \ Data Integration (DANDI), OpenNeuro, and Brain-CODE. The aim of this review\
    \ is to describe archives that provide researchers with tools to store, share,\
    \ and reanalyze both human and non-human neurophysiology data based on criteria\
    \ that are of interest to the neuroscientific community. The Brain Imaging Data\
    \ Structure (BIDS) and Neurodata Without Borders (NWB) are utilized by these archives\
    \ to make data more accessible to researchers by implementing a common standard.\
    \ As the necessity for integrating large-scale analysis into data repository platforms\
    \ continues to grow within the neuroscientific community, this article will highlight\
    \ the various analytical and customizable tools developed within the chosen archives\
    \ that may advance the field of neuroinformatics."
