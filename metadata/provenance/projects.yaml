version: 1
batch: full-con-projects
status: hand-authored-migration-source

evidence:
  legacy_catalogue:
    repository: https://github.com/con/centerforopenneuroscience.org.git
    commit: e6e9200a0987a65097afff896105ff838be1659e
    path: content/pages/projects.html
  structured_projects:
    repository: https://github.com/con/dump-research-info.git
    commit: 1c7e99ec6f296d5e6cb6a61e3b786227190802da
    records: data/con_site/XYZProject.json
    inventory: inputs/con_site/inventory.json
    coverage: inputs/con_site/coverage.json
  visible_people:
    path: profiles/con/provenance/people.yaml

transformations:
  - Selected all 23 projects visibly featured on the legacy projects page.
  - Preserved the six legacy categories and visible order as provenance.
  - Added explicit xyzri:XYZProject top-level discriminators.
  - Removed evidence-only about links and any depiction attributes.
  - Added native part_of links from every project to xyzrins:.
  - Retained the structured foaf:homepage literal for every project.
  - Retained all 33 native Associations whose targets are in the visible roster.
  - Omitted only the two Associations whose supporting people are not visible.

association_deferrals:
  - project: xyzrins:projects/ember
    object: xyzrins:persons/brock-wester
    roles:
      - obo:NCIT_C19924
    schema_type: dlthings:Association
    decision: >-
      Defer this exact source Association because Brock Wester is project
      support data but is not one of the 33 people visible on the legacy
      people page. Do not add a supporting person in this batch.
  - project: xyzrins:projects/openneuro
    object: xyzrins:persons/russell-poldrack
    roles:
      - obo:NCIT_C19924
    schema_type: dlthings:Association
    decision: >-
      Defer this exact source Association because Russell Poldrack is project
      support data but is not one of the 33 people visible on the legacy
      people page. Do not add a supporting person in this batch.

aliases_and_ambiguities:
  - affected:
      - xyzrins:projects/dandi
      - xyzrins:projects/ember
      - xyzrins:projects/openneuro
    legacy_heading_id: dandi
    decision: >-
      The legacy HTML reuses one heading ID for three projects. Stable PIDs,
      not that ambiguous fragment, identify the migrated records.
  - affected:
      - xyzrins:projects/bids
      - xyzrins:projects/yoda
    legacy_heading_id: bids
    decision: >-
      The legacy HTML reuses one heading ID for both records. Their distinct
      stable PIDs remain authoritative.
  - pid: xyzrins:projects/datalad-registry
    legacy_title: DataLad-Registry
    canonical_title: DataLad Registry
    decision: Retain the structured title and the legacy spelling as evidence.
  - pid: xyzrins:projects/heudiconv
    legacy_title: HeuDiConv / ReproIn
    canonical_title: HeuDiConv
    decision: Preserve the combined legacy wording in display_label.
  - pid: xyzrins:projects/con-tinuous
    legacy_title: (con/)tinuous
    canonical_title: con/tinuous
    decision: Retain the stable PID and structured title.
  - pid: xyzrins:projects/singularityhub-afterlife
    legacy_title: SingularityHub (after-life)
    canonical_title: SingularityHub (after-life)
    decision: >-
      Treat after-life as retained editorial wording, not as a lifecycle date
      or an inferred machine-readable status.

lifecycle_policy: >-
  The legacy and structured sources provide no reviewed project lifecycle
  dates. No start or end dates were invented for any project.

