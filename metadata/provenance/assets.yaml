projection_policy: >-
  The committed projection contains no duplicate asset payloads. The local
  build materializes the manifest-declared page-bundle paths only in ignored
  Hugo assembly state. Every annex-backed payload declares its own read-only
  retrieval source, media type, mode, key, and digest. Such payloads are
  hydrated before Hugo runs and are never converted to Git blobs.
