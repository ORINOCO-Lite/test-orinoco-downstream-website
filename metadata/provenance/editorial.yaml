version: 1
batch: full-con-editorial
status: hand-authored-migration-source
presentation: profiles/con/presentation.yaml

evidence:
  repository: https://github.com/con/centerforopenneuroscience.org.git
  commit: e6e9200a0987a65097afff896105ff838be1659e
  paths:
    homepage: theme/templates/index.html
    contact_footer: theme/templates/base.html
    people: content/pages/whoweare.html
    projects: content/pages/projects.html
    engage: content/pages/engage.html
    support: content/pages/support.html

adaptations:
  - route: /about/
    decision: >-
      Move the legacy homepage principles, background reading, and hero to a
      separate editorial page that works with the upstream article template.
  - route: /contact/
    decision: >-
      Adapt the legacy global footer into a focused contact page with email,
      GitHub, postal address, and the CON ROR identifier.
  - route: /engage/
    decision: >-
      Preserve contribution guidance and all declared pamphlet and poster
      artwork while using current internal project routes.
  - route: /support/
    decision: >-
      Preserve legacy supporter acknowledgments without inferring that the
      historical award links describe current funding periods.
  - route: /whoweare/
    decision: >-
      Replace the one-person compatibility page with all four legacy groups
      and links to the 33 canonical person pages.
  - route: /projects/
    decision: >-
      Add all six legacy categories and links to the 23 canonical project
      pages while retaining the upstream-generated project listing.

route_policy:
  preserved:
    - route: /projects/
      legacy_alias: /projects.html
    - route: /whoweare/
      legacy_alias: /whoweare.html
    - route: /engage/
      legacy_alias: /engage.html
    - route: /support/
      legacy_alias: /support.html
  clean_only:
    - /about/
    - /contact/
    - /explore/
    - /persons/
    - /publications/
    - /instruments/

homepage_policy:
  route: /
  source: profiles/con/metadata/records/XYZProject/site-root.yaml
  generated_projection: profiles/con/projection/content/_index.md
  competing_editorial_index: false
  rejected_alternative: >-
    Do not add profiles/con/editorial/content/_index.md or fork the upstream
    homepage layout to recreate the legacy landing page. Keep the homepage
    generated from xyzrins:. and place long-form principles at /about/.

internal_links:
  - /about/
  - /projects/
  - /whoweare/
  - /persons/
  - /publications/
  - /instruments/
  - /explore/
  - /engage/
  - /support/
  - /contact/

external_links:
  contact:
    - mailto:team@centerforopenneuroscience.org
    - https://github.com/con
    - https://ror.org/04tfhh831
  background_reading:
    - https://doi.org/10.1016/j.neuroimage.2022.119623
    - https://doi.org/10.1186/s13742-015-0072-7
    - https://doi.org/10.3389/fninf.2012.00022
  support:
    - https://www.dartmouth.edu/ccn/
    - https://www.nsf.gov/awardsearch/showAward?AWD_ID=1429999
    - https://reporter.nih.gov/project-details/8999833

