transformations:
  - Selected the 33 people visibly published on the legacy Who we are page.
  - Preserved the four legacy groups and the visible order within each group.
  - Added explicit xyzri:XYZPerson top-level discriminators.
  - Removed evidence-only about links to the legacy page.
  - Removed identifier creator fields while retaining their notations and types.
  - Retained structured vcard:Email literals and the reviewed Yaroslav homepage.
  - Omitted foaf:depiction and untyped owl:sameAs URLs pending separate review.
  - Associated both directors as marcrel:led and all other people as marcrel:ctb.
  - Retained the CON organization association ahead of the ordered people.

