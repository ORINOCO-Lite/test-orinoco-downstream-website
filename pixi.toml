[workspace]
name = "test-orinoco-downstream-website"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
copier = "==9.10.3"
hugo = "==0.161.1"
nodejs = ">=22,<23"
pyyaml = "==6.0.2"

[pypi-dependencies]
orinoco-lite = { url = "https://github.com/ORINOCO-Lite/orinoco-lite-dev/releases/download/v0.2.0rc10/orinoco_lite-0.2.0rc10-py3-none-any.whl#sha256=04c40f95a8e7227d84838887b66596912aeac1bf5fe2f046755b618b2c7baf9b" }
datalad = ">=1.6.2,<2"

[tasks]
hugo-projection-update = "mkdir -p generated && orinoco projection update"
validate = { depends-on = ["hugo-projection-update"], cmd = "orinoco validate" }
projection-verify = { depends-on = ["hugo-projection-update"], cmd = "orinoco projection verify" }
assets-hydrate = "orinoco assets hydrate"
assets-verify = "orinoco assets verify"
assets-prepare-online = { depends-on = ["assets-hydrate"], cmd = "orinoco assets verify" }
build = { depends-on = ["hugo-projection-update"], cmd = "orinoco build --destination build/site --base-url /" }
build-repeat = { depends-on = ["hugo-projection-update"], cmd = "orinoco build --destination build/site-repeat --base-url /" }
verify-deterministic = { depends-on = ["build", "build-repeat"], cmd = "python .orinoco-lite/tools/verify_deterministic_build.py build/site build/site-repeat --manifest build/deterministic-build.json" }
verify-local-preview = { depends-on = ["build"], cmd = "python .orinoco-lite/tools/verify_local_preview.py build/site" }
verify-build = { depends-on = ["verify-deterministic", "verify-local-preview"] }
build-pages = { depends-on = ["hugo-projection-update"], cmd = "python .orinoco-lite/tools/build_pages.py build/pages" }
build-browser-pages = { depends-on = ["hugo-projection-update"], cmd = "orinoco build --destination build/pages --base-url /test-orinoco-downstream-website/" }
serve = "orinoco serve --directory build/site --port 8765"
apply-editor-bundle = "orinoco editor apply"
verify-runtime = "orinoco runtime verify"
verify-hugo = "python .orinoco-lite/tools/verify_hugo.py --version 0.161.1 --extended"
verify-ownership = "python .orinoco-lite/tools/verify_template_ownership.py"
update-orinoco = "python .orinoco-lite/tools/update_orinoco.py"
update-check = "python .orinoco-lite/tools/update_orinoco.py --check"
test-consumer = "python .orinoco-lite/tools/run_consumer_tests.py"
install-browser-tests = "python .orinoco-lite/tools/install_browser_tests.py"
prepare-browser-binaries = { depends-on = ["install-browser-tests"], cmd = "python .orinoco-lite/tools/prepare_browser_runtime.py browsers", env = { PLAYWRIGHT_BROWSERS_PATH = "build/playwright-browsers" } }
test-browser-chromium = { depends-on = ["build-browser-pages", "prepare-browser-binaries"], cmd = "npm --prefix .orinoco-lite/tests/browser test -- --project=chromium", env = { ORINOCO_PAGES_ROOT = "build/pages", ORINOCO_PROJECT_PATH = "/test-orinoco-downstream-website/", PLAYWRIGHT_BROWSERS_PATH = "build/playwright-browsers" } }
prepare-browser-webkit-host = { depends-on = ["test-browser-chromium"], cmd = "python .orinoco-lite/tools/prepare_browser_runtime.py linux-host-dependencies" }
test-browser-webkit = { depends-on = ["prepare-browser-webkit-host"], cmd = "npm --prefix .orinoco-lite/tests/browser test -- --project=webkit", env = { ORINOCO_PAGES_ROOT = "build/pages", ORINOCO_PROJECT_PATH = "/test-orinoco-downstream-website/", PLAYWRIGHT_BROWSERS_PATH = "build/playwright-browsers" } }
test-browser = { depends-on = ["test-browser-webkit"] }
test = { depends-on = ["verify-ownership", "test-consumer"] }
test-all = { depends-on = ["assets-prepare-online", "validate", "projection-verify", "verify-runtime", "verify-hugo", "test", "verify-build", "test-browser"] }
