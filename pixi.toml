[workspace]
name = "test-orinoco-downstream-website"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
copier = "==9.10.3"
hugo = "==0.161.1"
pyyaml = "==6.0.2"

[pypi-dependencies]
orinoco-lite = { url = "https://github.com/ORINOCO-Lite/orinoco-lite-dev/releases/download/v0.2.0rc20/orinoco_lite-0.2.0rc20-py3-none-any.whl#sha256=5cec87a7b76457464b478c59567349c4d7db8f84378a92359feb1c381e7bc506" }
datalad = ">=1.6.2,<2"

[tasks]
projection-update = "mkdir -p generated && orinoco projection update"
validate = { depends-on = ["projection-update"], cmd = "orinoco validate" }
projection-verify = { depends-on = ["projection-update"], cmd = "orinoco projection verify" }
build = { depends-on = ["projection-update"], cmd = "orinoco build --destination build/site --base-url /" }
build-repeat = { depends-on = ["projection-update"], cmd = "orinoco build --destination build/site-repeat --base-url /" }
verify-deterministic = { depends-on = ["build", "build-repeat"], cmd = "python .orinoco-lite/tools/verify_deterministic_build.py build/site build/site-repeat --manifest build/deterministic-build.json" }
verify-local-preview = { depends-on = ["build"], cmd = "python .orinoco-lite/tools/verify_local_preview.py build/site" }
verify-build = { depends-on = ["verify-deterministic", "verify-local-preview"] }
build-pages = { depends-on = ["projection-update"], cmd = "python .orinoco-lite/tools/build_pages.py build/pages" }
serve = "orinoco serve --directory build/site --port 8765"
apply-editor-bundle = "orinoco editor apply"
verify-runtime = "orinoco runtime verify"
verify-hugo = "python .orinoco-lite/tools/verify_hugo.py --version 0.161.1 --extended"
verify-ownership = "python .orinoco-lite/tools/verify_template_ownership.py"
