version: 2

routing:
  strip_prefix: "xyzrins:"

homepage:
  pid: xyzrins:.
  template: site/projection-templates/homepage.md.j2
  reverse_injections:
    - from: generated_by
      to: generated
    - from: part_of
      to: parts
  inline:
    - associated_with
    - associated_with::roles
    - influenced_by
    - influenced_by::roles
    - identifiers::creator
    - part_of

pages:
  xyzri:XYZDataset:
    template: site/projection-templates/dataset.md.j2
    inline:
      - about
      - attributed_to
      - kind
      - rules
      - characterized_by
  xyzri:XYZObjective:
    template: site/projection-templates/objective.md.j2
    inline:
      - part_of
      - depends_on
  xyzri:XYZTopic:
    template: site/projection-templates/topic.md.j2
    inline:
      - part_of
  xyzri:XYZProject:
    template: site/projection-templates/project.md.j2
    select:
      links_to:
        field: part_of
        pid: xyzrins:.
        recursive: true
    reverse_injections:
      - from: generated_by
        to: generated
      - from: part_of
        to: parts
    inline:
      - associated_with
      - associated_with::roles
      - influenced_by
      - influenced_by::roles
      - identifiers::creator
      - part_of
  xyzri:XYZPerson:
    template: site/projection-templates/person.md.j2
    select:
      linked_from:
        pid: xyzrins:.
        field: associated_with
    inline:
      - delegated_by
      - delegated_by::roles
      - identifiers::creator
  xyzri:XYZPublication:
    template: site/projection-templates/publication.md.j2
    inline:
      - about
      - attributed_to
  xyzri:XYZInstrument:
    template: site/projection-templates/instrument.md.j2
    inline:
      - about
      - attributed_to
      - kind
      - rules

unrendered_classes:
  - xyzri:XYZOrganization
  - xyzri:XYZAgentRole
  - xyzri:XYZBibliographicType
  - xyzri:XYZInstrumentType

graph:
  producer: site/projection-tools/pool2graph.py
  node_classes:
    - xyzri:XYZDataset
    - xyzri:XYZInstrument
    - xyzri:XYZObjective
    - xyzri:XYZOrganization
    - xyzri:XYZPerson
    - xyzri:XYZProject
    - xyzri:XYZPublication
    - xyzri:XYZTopic
  relationship_fields:
    - about
    - associated_with
    - attributed_to
    - delegated_by
    - generated_by
    - influenced_by
    - part_of
  missing_external_targets: reject
