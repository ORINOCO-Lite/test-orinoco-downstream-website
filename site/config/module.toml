# Declaring mounts disables Hugo's implicit project mounts. The packaged
# runtime supplies the framework paths; this repository supplies only the
# flattened downstream paths declared here.
[[mounts]]
  source = "custom/assets/files"
  target = "assets"

[[mounts]]
  source = "site/framework/assets"
  target = "assets"

[[mounts]]
  source = "editorial"
  target = "content"

[[mounts]]
  source = "generated/projection/content"
  target = "content"

[[mounts]]
  source = "site/layouts"
  target = "layouts"

[[mounts]]
  source = "site/framework/layouts"
  target = "layouts"

[[mounts]]
  source = "site/static"
  target = "static"

[[mounts]]
  source = "generated/projection/static"
  target = "static"

[[mounts]]
  source = "site/framework/static"
  target = "static"
