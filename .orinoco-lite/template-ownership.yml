contract_version: 2

classes:
  template_owned:
    behavior: materialized-scaffold
    paths:
      - README.md
      - .gitignore
      - .copier-answers.yml
      - pixi.toml
      - .agents/**
      - .orinoco-lite/**
      - .github/workflows/pages.yml
      - .github/workflows/shacl-vue-proposal.yml
      - .github/workflows/validate.yml
      - docs/**
  site_specific:
    behavior: site-owned-input
    paths:
      - orinoco.yaml
      - site-specific/**
  extensions:
    behavior: site-owned-stable-hook
    paths:
      - extensions/**
  site_acceptance:
    behavior: site-owned-acceptance
    paths:
      - tests/**
  workflow_extensions:
    behavior: site-owned-stable-hook
    paths:
      - .github/workflows/curation-review.yml
  release_lock:
    behavior: exact-version-selection
    paths:
      - orinoco.lock
      - pixi.lock
  site_policy:
    behavior: site-owned-policy
    paths:
      - LICENSE*
      - CITATION*
      - CONTRIBUTING*
      - CODE_OF_CONDUCT*
  generated:
    behavior: ignored-runtime-output
    paths:
      - generated/**
      - build/**
