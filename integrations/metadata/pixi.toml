[workspace]
name = "orinoco-metadata-review"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]
requires-pixi = ">=0.73,<0.77"

[dependencies]
python = ">=3.12,<3.13"
pyyaml = "==6.0.2"
git = ">=2.55,<3"

[pypi-dependencies]
datalad = ">=1.6.2,<2"

[tasks]
review = "python tools/review.py review"
refresh-evidence = "python tools/review.py refresh-evidence"
extract-dump-research-info = { cmd = "python integrations/dump-research-info/metadata_adapter.py --downstream .", cwd = "../.." }
test = { cmd = "python -m unittest discover -s ../../.orinoco-lite/tests/integrations -p 'test_*.py' -v", env = { PYTHONPATH = "../.." } }
