contract_version: 1
classes:
  initialized_site_owned:
    paths:
      - orinoco.yaml
      - metadata/**
      - editorial/**
      - assets/**
      - site/**
      - integrations/**
  extensions:
    paths:
      - extensions/**
  consumer_tests:
    paths:
      - tests/__init__.py
      - tests/contract/**
      - tests/browser/**
      - tests/integrations/**
      - tests/offline/**
      - tests/parity/**
      - tests/traceability.json
      - package.json
      - package-lock.json
      - playwright.config.*
  site_policy:
    paths:
      - LICENSE*
      - CITATION*
      - CONTRIBUTING*
      - CODE_OF_CONDUCT*
  generated:
    paths:
      - generated/**
