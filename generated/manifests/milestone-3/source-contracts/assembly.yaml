version: 1
profile: con

digest:
  algorithm: sha256
  output: profiles/con/assembly/SHA256SUMS
  scope:
    - profiles/con/assembly.yaml
    - profiles/con/profile.yaml
    - profiles/con/presentation.yaml
    - config/con
    - profiles/con/assets.yaml
    - profiles/con/assets
    - profiles/con/editorial/content
    - profiles/con/layouts
    - profiles/con/projection/SHA256SUMS
    - profiles/con/projection/content
    - profiles/con/projection/records.jsonl
    - profiles/con/projection/static
    - profiles/con/static
    - upstream:archetypes
    - upstream:config/_default
    - upstream:layouts
    - upstream:assets
    - upstream:static
    - parent:tools/adapt_upstream_pages.py
    - parent:tools/build_con_site.py
    - parent:tools/con_assets.py
    - parent:pixi.toml
    - parent:pixi.lock
    - component-commit-pins
