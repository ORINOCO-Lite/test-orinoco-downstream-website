version: 1
profile: con

inputs:
  canonical_records: profiles/con/metadata/records
  reference_records: profiles/con/metadata/reference

snapshot:
  records: profiles/con/projection/records.jsonl
  format: qri-record-jsonl
  collection: con-public
  sort_key: [schema_type, pid]

render:
  engine: qri
  content_root: profiles/con/projection/content
  pages:
    xyzri:XYZDataset: page_templates/dataset.md.j2
    xyzri:XYZObjective: page_templates/objective.md.j2
    xyzri:XYZTopic: page_templates/topic.md.j2
    xyzri:XYZProject: page_templates/project.md.j2
    xyzri:XYZPerson: page_templates/person.md.j2
    xyzri:XYZPublication: page_templates/publication.md.j2
    xyzri:XYZInstrument: page_templates/instrument.md.j2
  homepage:
    pid: xyzrins:.
    template: page_templates/homepage.md.j2
  unrendered_classes:
    - xyzri:XYZOrganization
    - xyzri:XYZAgentRole
    - xyzri:XYZBibliographicType
    - xyzri:XYZInstrumentType

graph:
  producer: code/pool2graph.py
  output: profiles/con/projection/static/graph.json
  node_classes:
    - xyzri:XYZDataset
    - xyzri:XYZInstrument
    - xyzri:XYZObjective
    - xyzri:XYZOrganization
    - xyzri:XYZPerson
    - xyzri:XYZProject
    - xyzri:XYZPublication
    - xyzri:XYZTopic
  relationship_fields:
    - about
    - associated_with
    - attributed_to
    - delegated_by
    - generated_by
    - influenced_by
    - part_of
  missing_external_targets: reject

digest:
  algorithm: sha256
  output: profiles/con/projection/SHA256SUMS
  scope:
    - profiles/con/profile.yaml
    - profiles/con/projection.yaml
    - profiles/con/metadata
    - upstream:page_templates
    - upstream:code/pool2graph.py
    - upstream:.forgejo/workflows/update-from-pool.yaml
    - parent:submodules/things-schemas/src/demo-research-information/unreleased.yaml
    - parent:tools/con_projection.py
    - component-commit-pins
    - projection-runtime-pins

policy:
  canonical_source: profiles/con/metadata
  generated_files_are_review_snapshot: true
  modify_upstream_content: false
  modify_upstream_templates: false
  modify_upstream_layouts: false
  custom_renderer: false
  generic_relationship_bridge: false
